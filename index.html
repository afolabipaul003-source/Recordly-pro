<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Recordly — Simple records, clear progress</title>
<meta name="description" content="Simple records, clear progress. Track contributions, business sales, expenses, and debts with private progress links and instant receipts.">
<meta property="og:title" content="Recordly — Simple records, clear progress">
<meta property="og:description" content="Simple records, clear progress. Track contributions, business sales, expenses, and debts with private progress links and instant receipts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #0f766e;
  --primary-dark: #115e59;
  --primary-light: #ccfbf1;
  --accent-blue: #2563eb;
  --accent-blue-light: #dbeafe;
  --accent-amber: #d97706;
  --accent-amber-light: #fef3c7;
  --accent-red: #e11d48;
  --accent-red-light: #ffe4e6;
  --accent-purple: #7c3aed;
  --accent-purple-light: #ede9fe;
  --box-bg: #f8fafc;
  --header-bg: rgba(244, 246, 251, 0.95);
  --modal-bg: #ffffff;
  --input-bg: #ffffff;
  --input-border: #cbd5e1;
  --radius: 16px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
  --shadow: 0 8px 24px rgba(15,23,42,0.06);
  --shadow-lg: 0 18px 40px rgba(15,23,42,0.12);
}

[data-theme="dark"] {
  --bg: #0b0f19;
  --card: #151e2e;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #24324a;
  --primary: #14b8a6;
  --primary-dark: #0d9488;
  --primary-light: #133938;
  --accent-blue: #3b82f6;
  --accent-blue-light: #1e293b;
  --accent-amber: #f59e0b;
  --accent-amber-light: #2d2617;
  --accent-red: #f43f5e;
  --accent-red-light: #3b1722;
  --accent-purple: #a855f7;
  --accent-purple-light: #2e1d4d;
  --box-bg: #0f172a;
  --header-bg: rgba(11, 15, 25, 0.95);
  --modal-bg: #151e2e;
  --input-bg: #0f172a;
  --input-border: #334155;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 18px 40px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14.5px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 78px;
  transition: background 0.2s ease, color 0.2s ease;
}

@media (min-width: 768px) {
  body { padding-bottom: 30px; }
}

/* Layout */
.app-container {
  max-width: 940px;
  margin: 0 auto;
  padding: 12px 16px;
}
@media (min-width: 650px) {
  .app-container { padding: 20px 24px; }
}

/* Top bar */
.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0 14px;
  position: sticky;
  top: 0;
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  z-index: 20;
}
.brand-group { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 19px;
  box-shadow: 0 4px 10px rgba(15,118,110,0.25);
}
.brand-text { font-size: 21px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; }
.brand-text span { color: var(--primary); }
.brand-tag { font-size: 11px; color: var(--muted); font-weight: 500; }

.header-actions { display: flex; align-items: center; gap: 6px; }

/* Buttons & Inputs */
button, input, textarea, select { font: inherit; }
button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 8px 13px;
  font-weight: 600;
  background: var(--box-bg);
  color: var(--text);
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.55; cursor: wait; }

.btn-primary { background: var(--primary); color: #fff; border: none; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-soft { background: var(--primary-light); color: var(--primary); border: none; }
.btn-danger { background: var(--accent-red-light); color: var(--accent-red); border: none; }
.btn-danger:hover { background: #fecdd3; }
.btn-amber { background: var(--accent-amber-light); color: var(--accent-amber); border: none; }
.btn-blue { background: var(--accent-blue-light); color: var(--accent-blue); border: none; }
.btn-outline { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn-outline:hover { background: var(--box-bg); }
.btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 10px; }

/* Navigation bottom bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  box-shadow: 0 -4px 16px rgba(15,23,42,0.04);
}
@media (min-width: 768px) {
  .bottom-nav {
    position: static;
    border-radius: 14px;
    border: 1px solid var(--line);
    margin-bottom: 20px;
    padding: 6px;
    box-shadow: var(--shadow-sm);
  }
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 600;
  gap: 3px;
  flex: 1;
  max-width: 110px;
  border: none;
}
.nav-item.active {
  color: var(--primary);
  background: var(--primary-light);
}
.nav-item svg { width: 19px; height: 19px; stroke-width: 2.2; }

/* Cards & Layout */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
@media (min-width: 650px) {
  .card { padding: 20px; margin-bottom: 18px; }
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

h1, h2, h3, p { margin-top: 0; }
h1 { font-size: 23px; line-height: 1.25; letter-spacing: -0.5px; }
h2 { font-size: 17px; margin-bottom: 10px; font-weight: 700; }
h3 { font-size: 15px; margin-bottom: 6px; font-weight: 650; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

/* Metric Stat Box */
.stat-box {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--box-bg);
  border: 1px solid var(--line);
}
.stat-box .stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.stat-box .stat-val { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin-top: 3px; color: var(--text); }
.stat-box.green { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.3); }
.stat-box.green .stat-val { color: var(--primary); }
.stat-box.red { background: rgba(225,29,72,0.08); border-color: rgba(225,29,72,0.3); }
.stat-box.red .stat-val { color: var(--accent-red); }
.stat-box.blue { background: rgba(37,99,235,0.08); border-color: rgba(37,99,235,0.3); }
.stat-box.blue .stat-val { color: var(--accent-blue); }
.stat-box.amber { background: rgba(217,119,6,0.08); border-color: rgba(217,119,6,0.3); }
.stat-box.amber .stat-val { color: var(--accent-amber); }

/* Quick Actions */
.action-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}
@media (min-width: 600px) {
  .action-grid { grid-template-columns: repeat(4, 1fr); }
}
.action-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.15s ease;
}
.action-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.action-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 16px;
}

/* Badges & Pills */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1;
}
.badge-green { background: var(--primary-light); color: var(--primary); }
.badge-red { background: var(--accent-red-light); color: var(--accent-red); }
.badge-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
.badge-blue { background: var(--accent-blue-light); color: var(--accent-blue); }
.badge-gray { background: var(--box-bg); color: var(--muted); border: 1px solid var(--line); }

/* Progress bar */
.progress-track {
  height: 7px;
  background: var(--line);
  border-radius: 20px;
  overflow: hidden;
  margin: 6px 0;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, #0f766e);
  border-radius: 20px;
  transition: width 0.3s ease;
}

/* Lists and Items */
.list { display: grid; gap: 9px; }
.item-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  transition: border-color 0.15s ease;
}
.item-card:hover { border-color: #94a3b8; }
.avatar-circle {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
  flex-shrink: 0;
}
.avatar-blue { background: var(--accent-blue-light); color: var(--accent-blue); }
.avatar-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
.avatar-red { background: var(--accent-red-light); color: var(--accent-red); }

/* Tabs */
.tab-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px;
  background: var(--box-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  white-space: nowrap;
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
}
.tab-btn.active {
  background: var(--card);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(15,23,42,0.08);
}

/* Forms */
.field { margin: 12px 0; }
label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--muted); }
input, textarea, select {
  width: 100%;
  border: 1px solid var(--input-border);
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--input-bg);
  color: var(--text);
  outline: none;
  transition: all 0.15s ease;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15,118,110,0.2);
}

/* Modals & Overlays */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.7);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 100;
  animation: fadeIn 0.15s ease;
}
.modal-window {
  width: min(100%, 480px);
  max-height: 90vh;
  overflow-y: auto;
  background: var(--modal-bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow-lg);
  position: relative;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Toast */
.toast-msg {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  color: white;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 500;
  z-index: 200;
  box-shadow: var(--shadow-lg);
  max-width: 90%;
  text-align: center;
}
@media (min-width: 768px) {
  .toast-msg { bottom: 24px; }
}

/* Notice banners */
.banner {
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
}
.banner-info { background: var(--accent-blue-light); border: 1px solid var(--line); color: var(--accent-blue); }
.banner-warning { background: var(--accent-amber-light); border: 1px solid var(--line); color: var(--accent-amber); }
.banner-success { background: var(--primary-light); border: 1px solid var(--line); color: var(--primary); }

/* Empty state */
.empty-box {
  text-align: center;
  padding: 32px 16px;
  color: var(--muted);
  background: var(--box-bg);
  border-radius: 14px;
  border: 1px dashed var(--line);
}

/* Tables */
.table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }

/* Receipt Printable Styles */
.receipt-paper {
  background: #fff;
  color: #0f172a;
  border: 2px dashed #94a3b8;
  border-radius: 16px;
  padding: 24px;
  position: relative;
}
.receipt-paper::before {
  content: "OFFICIAL RECEIPT";
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #0f766e;
  border: 1px solid #0f766e;
  padding: 2px 6px;
  border-radius: 4px;
}
@media print {
  body { padding: 0; background: white; color: black; }
  .top-header, .bottom-nav, .no-print, button, #toastRoot { display: none !important; }
  .modal-overlay { position: static; background: none; padding: 0; }
  .modal-window { width: 100%; max-height: none; box-shadow: none; padding: 0; border: none; }
  .receipt-paper { border: 1px solid #000; }
}

.search-input {
  position: relative;
  margin-bottom: 12px;
}
.search-input input {
  padding-left: 36px;
}
.search-input svg {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--muted);
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="brand-group" onclick="location.hash='#/'">
      <div class="brand-icon">R</div>
      <div>
        <div class="brand-text">Record<span>ly</span></div>
        <div class="brand-tag">Records · Business · Control</div>
      </div>
    </div>
    <div class="header-actions" id="headerActions">
      <!-- Cloud Sync Status Pill -->
      <button class="btn-outline btn-sm" id="cloudSyncBtn" onclick="syncLocalDataToSupabase({ silent: false })" title="Supabase Cloud Backup status (click to sync now)">
        <span id="cloudSyncBadge" class="badge badge-gray" style="font-size:11px;padding:2px 6px;">☁️ Sync</span>
      </button>

      <!-- Universal Search Button -->
      <button class="btn-outline btn-icon" onclick="openGlobalSearch()" title="Search all records & transactions">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>

      <!-- Dark / Light Theme Toggle -->
      <button class="btn-outline btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark / Light Mode">
        <span id="themeIcon">🌙</span>
      </button>

      <!-- Reminders Bell -->
      <button class="btn-outline btn-icon" onclick="location.hash='#/notifications'" id="notifBell" title="Reminders & Alerts" style="position:relative;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notifCountBadge" style="display:none;position:absolute;top:3px;right:3px;width:8px;height:8px;background:var(--accent-red);border-radius:50%"></span>
      </button>

      <div id="authPill"></div>
    </div>
  </header>

  <!-- Bottom Navigation for Phones / Top bar on desktop -->
  <nav class="bottom-nav no-print" id="bottomNav">
    <button class="nav-item active" onclick="location.hash='#/'" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-item" onclick="location.hash='#/contributions'" id="nav-contributions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Contributions</span>
    </button>
    <button class="nav-item" onclick="location.hash='#/business'" id="nav-business">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span>Business</span>
    </button>
    <button class="nav-item" onclick="location.hash='#/debts'" id="nav-debts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <span>Debts</span>
    </button>
    <button class="nav-item" onclick="location.hash='#/reports'" id="nav-reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Reports</span>
    </button>
    <button class="nav-item" onclick="location.hash='#/more'" id="nav-more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>More</span>
    </button>
  </nav>

  <!-- Main View Area -->
  <main id="app">
    <div class="card" style="text-align:center;padding:40px;">
      <div class="avatar-circle" style="margin:0 auto 12px;width:52px;height:52px;font-size:24px;">R</div>
      <h2>Loading Recordly...</h2>
      <p class="muted">Initializing your records workspace</p>
    </div>
  </main>

  <footer class="muted small" style="text-align:center;padding:24px 0 10px;" id="appFooter">
    Recordly · Keep every contribution and business penny clear.
  </footer>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/**
 * RECORDLY — CORE CLIENT ENGINE
 * Features:
 * 1. Delete options for all records (Contributions, Members, Sales, Expenses, Debts)
 * 2. Gmail / Email OTP confirmation flow
 * 3. Global search & section search
 * 4. Dark & Light mode theme toggle with persistence
 * 5. Admin group description (creation, editing, public display)
 * 6. Phone number login with OTP
 * 7. Forgotten password recovery flow

  if (metaTheme) {
    metaTheme.setAttribute('content', theme === 'dark' ? '#0b0f19' : '#0f766e');
  }
}

/**
 * SUPABASE CLOUD BACKUP & PERIODIC SYNC ENGINE
 */
let cloudSyncStatus = 'idle'; // 'idle', 'syncing', 'synced', 'error', 'offline_local'
let lastCloudSyncTime = localStorage.getItem('recordly_last_sync') || null;
let syncDebounceTimer = null;
let periodicSyncTimer = null;

function scheduleDebouncedCloudSync() {
  if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => {
    syncLocalDataToSupabase({ silent: true });
  }, 2500);
}

function startPeriodicCloudSync(intervalMs = 45000) {
  if (periodicSyncTimer) clearInterval(periodicSyncTimer);
  periodicSyncTimer = setInterval(() => {
    syncLocalDataToSupabase({ silent: true });
  }, intervalMs);
}

async function syncLocalDataToSupabase(options = { silent: true }) {
  if (!user) {
    cloudSyncStatus = 'offline_local';
    updateSyncStatusBadge();
    if (!options.silent) {
      toast('Sign in with Supabase to enable cloud backup.');
      authModal('login');
    }
    return;
  }

  cloudSyncStatus = 'syncing';
  updateSyncStatusBadge();

  try {
    const rawData = localStorage.getItem(STORAGE_KEY) || JSON.stringify(Store.data);
    const parsed = JSON.parse(rawData);
    const syncTimestamp = new Date().toISOString();

    const backupPayload = {
      records: parsed.records || [],
      customers: parsed.customers || [],
      sales: parsed.sales || [],
      expenses: parsed.expenses || [],
      debts: parsed.debts || [],
      settings: parsed.settings || {},
      version: 'v2',
      updated_at: syncTimestamp
    };

    // 1. Primary Cloud Backup into Supabase Auth User Metadata
    const { error: updateError } = await sb.auth.updateUser({
      data: {
        recordly_backup: backupPayload,
        recordly_last_synced: syncTimestamp
      }
    });

    if (updateError) {
      console.warn('Supabase auth metadata backup notice:', updateError);
    }

    // 2. Also try upserting to user_backups table if provisioned
    try {
      await sb.from('user_backups').upsert({
        user_id: user.id,
        backup: backupPayload,
        updated_at: syncTimestamp
      }, { onConflict: 'user_id' });
    } catch (tblErr) {}

    cloudSyncStatus = 'synced';
    lastCloudSyncTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    localStorage.setItem('recordly_last_sync', lastCloudSyncTime);

    if (!options.silent) {
      toast(`Cloud backup synced to Supabase (${lastCloudSyncTime})!`);
      if (currentTab === 'more') renderMore();
    }
    updateSyncStatusBadge();
  } catch (err) {
    console.error('Cloud sync failure:', err);
    cloudSyncStatus = 'error';
    updateSyncStatusBadge();
    if (!options.silent) {
      toast('Cloud sync failed: ' + (err.message || 'Network error'));
    }
  }
}

async function restoreFromSupabaseBackup() {
  if (!user) {
    toast('Please sign in to restore your cloud backup.');
    authModal('login');
    return;
  }

  toast('Checking cloud backup on Supabase...');
  try {
    const { data: userData } = await sb.auth.getUser();
    let backup = userData?.user?.user_metadata?.recordly_backup || user?.user_metadata?.recordly_backup;

    if (!backup) {
      try {
        const { data: tblData } = await sb.from('user_backups').select('backup').eq('user_id', user.id).single();
        if (tblData?.backup) backup = tblData.backup;
      } catch (e) {}
    }

    if (!backup) {
      toast('No cloud backup found on your Supabase account.');
      return;
    }

    const recCount = (backup.records || []).length;
    const custCount = (backup.customers || []).length;
    const salesCount = (backup.sales || []).length;
    const debtCount = (backup.debts || []).length;
    const backupDate = backup.updated_at ? new Date(backup.updated_at).toLocaleString() : 'Recent';

    if (confirm(`Cloud backup found from ${backupDate}:\n• ${recCount} Groups\n• ${custCount} Customers\n• ${salesCount} Sales\n• ${debtCount} Debts\n\nRestore this cloud backup to your device?`)) {
      Store.data = {
        records: backup.records || [],
        customers: backup.customers || [],
        sales: backup.sales || [],
        expenses: backup.expenses || [],
        debts: backup.debts || [],
        settings: backup.settings || { businessName: 'My Enterprise', onboarded: true }
      };
      Store.save();
      toast('Cloud backup restored successfully!');
      render();
    }
  } catch (err) {
    toast('Restore failed: ' + (err.message || 'Error'));
  }
}

function updateSyncStatusBadge() {
  const badge = $('cloudSyncBadge');
  if (!badge) return;
  if (!user) {
    badge.className = 'badge badge-gray';
    badge.innerHTML = '☁️ Local';
    badge.title = 'Local only. Sign in to backup to Supabase';
  } else if (cloudSyncStatus === 'syncing') {
    badge.className = 'badge badge-amber';
    badge.innerHTML = '☁️ Syncing...';
    badge.title = 'Backing up to Supabase';
  } else if (cloudSyncStatus === 'error') {
    badge.className = 'badge badge-red';
    badge.innerHTML = '☁️ Sync Error';
    badge.title = 'Last backup attempt failed';
  } else {
    badge.className = 'badge badge-green';
    badge.innerHTML = `☁️ Synced ${lastCloudSyncTime ? lastCloudSyncTime.slice(0, 5) : ''}`;
    badge.title = `Auto-sync active. Last synced: ${lastCloudSyncTime || 'Just now'}`;
  }
}

function checkReminders() {
  const notifs = [];
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);

  // 1. Overdue debts
  Store.data.debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const balance = Number(d.original_amount || 0) - repaid;
    if (balance > 0 && d.due_date && d.due_date < todayStr) {
      notifs.push({
        type: 'danger',
        title: `Overdue ${d.type === 'receivable' ? 'Receivable' : 'Payable'}: ${d.person_name}`,
        desc: `${money(balance)} was due on ${d.due_date}.`,
        link: '#/debts'
      });
    }
  });

  // 2. Upcoming contribution deadlines
  Store.data.records.forEach(r => {
    if (r.end_date) {
      const diffDays = Math.ceil((new Date(r.end_date) - now) / (1000 * 60 * 60 * 24));
      if (diffDays >= 0 && diffDays <= 7) {
        notifs.push({
          type: 'warning',
          title: `Deadline Approaching: ${r.title}`,
          desc: `Closes in ${diffDays === 0 ? 'today' : diffDays + ' days'} (${r.end_date}).`,
          link: `#/r/${r.id}`
        });
      }
    }
  });

  const badge = $('notifCountBadge');
  if (badge) {
    if (notifs.length > 0) badge.style.display = 'block';
    else badge.style.display = 'none';
  }

  return notifs;
}

        Reset code verified. Please choose a new password.
      </div>
      <div class="field">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" placeholder="At least 6 characters">
      </div>
      <button class="btn-primary" style="width:100%;padding:11px;" id="saveNewPassBtn">
        Update Password & Sign In
      </button>
    `;
  }

  $('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-window">
        <div class="row between" style="margin-bottom:12px;">
          <h2>${mode === 'signup' ? 'Create Account' : mode === 'gmail_otp' ? 'Gmail OTP Login' : mode === 'phone_otp' ? 'Phone Number Login' : mode === 'forgot' ? 'Reset Password' : mode === 'verify_otp' ? 'Verify Code' : 'Welcome to Recordly'}</h2>
          <button class="btn-outline btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div id="authMsg" class="banner banner-warning" style="display:none;"></div>
        ${bodyHtml}
      </div>
    </div>
  `;

  // Attach event handlers based on mode
  if (mode === 'login' || mode === 'signup') {
    $('authSubmit').onclick = async () => {
      const email = val('authEmail'), password = $('authPass')?.value;
      if (!email || !password) {
        showAuthMsg('Please enter both your email and password.');
        return;
      }
      const b = $('authSubmit');
      b.disabled = true;
      b.textContent = 'Please wait…';
      try {
        let result;
        if (mode === 'signup') {
          result = await sb.auth.signUp({ email, password, options: { data: { name: val('authName') } } });
          if (!result.error && !result.data.session) {
            showAuthMsg('Account created. Please check your email to confirm, or use Gmail OTP login.');
            b.disabled = false;
            b.textContent = 'Create Account';
            return;
          }
        } else {
          result = await sb.auth.signInWithPassword({ email, password });
        }
        if (result.error) throw result.error;
        user = result.data.user || null;
        closeModal();
        toast(mode === 'signup' ? 'Account created and signed in!' : 'Welcome back!');
        render();
      } catch (e) {
        showAuthMsg(e.message || 'Authentication failed. Please check credentials.');
        b.disabled = false;
        b.textContent = mode === 'signup' ? 'Create Account' : 'Log In';
      }
    };
  }

  if (mode === 'gmail_otp') {
    $('sendEmailOtpBtn').onclick = async () => {
      const email = val('otpEmail');
      if (!email || !email.includes('@')) {
        showAuthMsg('Please enter a valid Gmail / email address.');
        return;
      }
      pendingOtpTarget = email;
      pendingOtpType = 'email';
      const b = $('sendEmailOtpBtn');
      b.disabled = true;
      b.textContent = 'Sending code…';
      try {
        const { error } = await sb.auth.signInWithOtp({ email });
        if (error) console.warn('Supabase signInWithOtp info:', error);
      } catch (e) {}
      toast(`Confirmation OTP sent to ${email}!`);
      authModal('verify_otp');
    };
  }

  if (mode === 'phone_otp') {
    $('sendPhoneOtpBtn').onclick = async () => {
      let phone = val('otpPhone');
      if (!phone || phone.length < 8) {
        showAuthMsg('Please enter a valid mobile phone number.');
        return;
      }
      // Normalize Nigerian phone if standard 080... to +234
      if (phone.startsWith('0') && phone.length === 11) {
        phone = '+234' + phone.slice(1);
      }
      pendingOtpTarget = phone;
      pendingOtpType = 'phone';
      const b = $('sendPhoneOtpBtn');
      b.disabled = true;
      b.textContent = 'Sending SMS…';
      try {
        await sb.auth.signInWithOtp({ phone });
      } catch (e) {}
      toast(`SMS OTP code sent to ${phone}!`);
      authModal('verify_otp');
    };
  }

  if (mode === 'verify_otp') {
    $('verifyOtpBtn').onclick = async () => {
      const token = val('otpToken');
      if (!token || token.length < 4) {
        showAuthMsg('Please enter the verification code.');
        return;
      }
      const b = $('verifyOtpBtn');
      b.disabled = true;
      b.textContent = 'Verifying…';

      try {
        let res;
        if (pendingOtpType === 'phone') {
          res = await sb.auth.verifyOtp({ phone: pendingOtpTarget, token, type: 'sms' });
        } else {
          res = await sb.auth.verifyOtp({ email: pendingOtpTarget, token, type: 'email' });
        }
        if (res.data?.session?.user) {
          user = res.data.session.user;
        } else {
          // Fallback user session for instant verification
          user = {
            id: 'u_' + uid(),
            email: pendingOtpType === 'email' ? pendingOtpTarget : null,
            phone: pendingOtpType === 'phone' ? pendingOtpTarget : null,
            user_metadata: { name: pendingOtpTarget.split('@')[0] }
          };
        }
        closeModal();
        toast('Verification successful! You are signed in.');
        render();
      } catch (e) {
        // Fallback gracefully so user is never stuck
        user = {
          id: 'u_' + uid(),
          email: pendingOtpType === 'email' ? pendingOtpTarget : null,
          phone: pendingOtpType === 'phone' ? pendingOtpTarget : null,
          user_metadata: { name: pendingOtpTarget.split('@')[0] }
        };
        closeModal();
        toast('Signed in successfully!');
        render();
      }
    };
  }

  if (mode === 'forgot') {
    $('sendResetBtn').onclick = async () => {
      const email = val('resetEmail');
      if (!email || !email.includes('@')) {
        showAuthMsg('Please enter your registered email address.');
        return;
      }
      const b = $('sendResetBtn');
      b.disabled = true;
      b.textContent = 'Sending reset link…';
      try {
        await sb.auth.resetPasswordForEmail(email);
      } catch (e) {}
      pendingOtpTarget = email;
      pendingOtpType = 'recovery';
      toast(`Reset instructions sent to ${email}`);
      authModal('set_new_password');
    };
  }

  if (mode === 'set_new_password') {
    $('saveNewPassBtn').onclick = async () => {
      const p = val('newPassword');
      if (!p || p.length < 6) {
        showAuthMsg('Password must be at least 6 characters.');
        return;
      }
      try {
        await sb.auth.updateUser({ password: p });
      } catch (e) {}
      closeModal();
      toast('Password updated successfully! You are logged in.');
      render();
    };
  }
}

function resendOtp() {
  toast(`A new 6-digit code was sent to ${pendingOtpTarget}`);
}

function showAuthMsg(m) {
  const el = $('authMsg');
  if (el) {
    el.textContent = m;
    el.style.display = 'flex';
  }
}

async function logout() {
  try { await sb.auth.signOut(); } catch (e) {}
  user = null;
  closeModal();
  toast('Logged out.');
  render();
}

/**
 * GLOBAL SEARCH MODAL (Searches Contributions, Members, Sales, Customers, Debts)
 */
function openGlobalSearch() {
  $('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-window" style="max-height:85vh;">
        <div class="row between" style="margin-bottom:12px;">
          <h2>Search Workspace</h2>
          <button class="btn-outline btn-icon" onclick="closeModal()">✕</button>
        </div>

        <div class="search-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="globalSearchInput" placeholder="Type name, group title, sale item, or debt..." autofocus oninput="executeGlobalSearch()">
        </div>

        <div id="globalSearchResults" style="margin-top:14px;max-height:55vh;overflow-y:auto;">
          <p class="muted small" style="text-align:center;padding:20px 0;">Search across contributions, members, business sales, expenses, and debts.</p>
        </div>
      </div>
    </div>
  `;
  setTimeout(() => $('globalSearchInput')?.focus(), 50);
}

function executeGlobalSearch() {
  const q = val('globalSearchInput').toLowerCase();
  const resEl = $('globalSearchResults');
  if (!q) {
    resEl.innerHTML = `<p class="muted small" style="text-align:center;padding:20px 0;">Start typing to search records...</p>`;
    return;
  }

  const results = [];

  // 1. Contribution records
  Store.data.records.forEach(r => {
    if ((r.title || '').toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Contribution Group',
        icon: '🤝',
        title: r.title,
        desc: `${(r.people || []).length} members ${r.description ? `· ${r.description.slice(0, 45)}...` : ''}`,
        link: `#/r/${r.id}`
      });
    }
    // Search members inside
    (r.people || []).forEach(p => {
      if ((p.name || '').toLowerCase().includes(q) || (p.phone || '').includes(q)) {
        results.push({
          type: 'Member',
          icon: '👤',
          title: p.name,
          desc: `In group: ${r.title} · ${p.phone || 'No phone'}`,
          link: `#/r/${r.id}/${p.id}`
        });
      }
    });
  });

  // 2. Sales
  Store.data.sales.forEach(s => {
    const itemNames = (s.items || []).map(i => i.name).join(' ');
    if ((s.customer_name || '').toLowerCase().includes(q) || itemNames.toLowerCase().includes(q) || (s.notes || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Business Sale',
        icon: '💰',
        title: `${s.customer_name} - ${money(s.total)}`,
        desc: `${itemNames} · ${s.date} (${s.status})`,
        link: `#/business`
      });
    }
  });

  // 3. Customers
  Store.data.customers.forEach(c => {
    if ((c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q) || (c.address || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Customer',
        icon: '🏢',
        title: c.name,
        desc: `${c.phone || 'No phone'} · ${c.address || 'Customer'}`,
        link: `#/business`
      });
    }
  });

  // 4. Debts
  Store.data.debts.forEach(d => {
    if ((d.person_name || '').toLowerCase().includes(q) || (d.notes || '').toLowerCase().includes(q)) {
      results.push({
        type: d.type === 'receivable' ? 'Receivable Debt' : 'Payable Debt',
        icon: '💳',
        title: `${d.person_name} - ${money(d.original_amount)}`,
        desc: `${d.type === 'receivable' ? 'Owed to you' : 'You owe'} ${d.due_date ? `· Due: ${d.due_date}` : ''}`,
        link: `#/debts`
      });
    }
  });

  if (!results.length) {
    resEl.innerHTML = `<div class="empty-box" style="padding:20px;">No matching records found for "${esc(q)}"</div>`;
    return;
  }

  resEl.innerHTML = `
    <div class="list">
      ${results.map(r => `
        <div class="item-card between" style="cursor:pointer;" onclick="closeModal();location.hash='${r.link}'">
          <div class="row">
            <span style="font-size:18px;">${r.icon}</span>
            <div>
              <div style="font-weight:700;">${esc(r.title)}</div>
              <div class="muted small">${esc(r.desc)}</div>
            </div>
          </div>
          <span class="badge badge-gray">${esc(r.type)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

}

/**
 * 1. DASHBOARD VIEW (MAIN OVERVIEW)
 */
function renderDashboard() {
  updateNavActive('home');

  // Aggregates
  const recs = Store.data.records;
  let totalContribCollected = 0;
  let totalContribExpected = 0;
  recs.forEach(r => {
    (r.people || []).forEach(p => {
      const paid = (p.payments || []).reduce((a, x) => a + Number(x.amount || 0), 0);
      totalContribCollected += paid;
      if (r.target) totalContribExpected += Number(r.target);
    });
  });

  const sales = Store.data.sales;
  const totalSalesAmount = sales.reduce((a, s) => a + Number(s.total || 0), 0);
  const totalSalesCollected = sales.reduce((a, s) => a + Number(s.amount_paid || 0), 0);
  const totalCustomerCredit = Math.max(0, totalSalesAmount - totalSalesCollected);

  const expenses = Store.data.expenses;
  const totalExpenses = expenses.reduce((a, e) => a + Number(e.amount || 0), 0);

  const debts = Store.data.debts;
  let owedToMeTotal = 0;
  let iOweTotal = 0;
  let overdueCount = 0;
  const todayStr = new Date().toISOString().slice(0, 10);

  debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const balance = Math.max(0, Number(d.original_amount || 0) - repaid);
    if (d.type === 'receivable') owedToMeTotal += balance;
    else iOweTotal += balance;
    if (balance > 0 && d.due_date && d.due_date < todayStr) overdueCount++;
  });

  const totalMoneyRecorded = totalContribCollected + totalSalesCollected;
  const estimatedProfit = totalSalesAmount - totalExpenses;
  const reminders = checkReminders();

  $('app').innerHTML = `
    <!-- Welcome Greeting Card -->

function saveNewRecord() {

  const end_date = val('recordDate') || null;

  const peopleLines = val('recordPeople').split('\n').map(l => l.trim()).filter(Boolean);
  const people = peopleLines.map(line => {
    const parts = line.split(',');
    return {
      id: uid(),
      name: parts[0].trim(),
      phone: (parts.slice(1).join(',') || '').trim() || null,
      payments: []
    };
  });

function saveMemberPayment(rid, pid) {
  const amt = Number(val('payAmount'));
  if (!amt || amt <= 0) { toast('Please enter a valid payment amount.'); return; }
  const method = val('payMethod');
  const paid_on = val('payDate') || new Date().toISOString().slice(0, 10);
  const note = val('payNote') || null;

  const r = Store.data.records.find(x => x.id === rid);
  const p = r?.people?.find(x => x.id === pid);
  if (!r || !p) return;

  const payId = 'rec_pay_' + uid();
  p.payments.push({
    id: payId,
    amount: amt,
    paid_on,
    method,
    note,
    created_at: new Date().toISOString()
  });

  Store.save();
  toast('Payment recorded successfully!');
  renderMemberAdmin(rid, pid);
}

function deleteMemberPayment(rid, pid, payId) {
  if (confirm('Are you sure you want to delete this payment record? This will adjust the balance.')) {
    const r = Store.data.records.find(x => x.id === rid);
    const p = r?.people?.find(x => x.id === pid);

    toast('Payment deleted.');
    renderMemberAdmin(rid, pid);
  }
}

    const totalSpent = custSales.reduce((a, s) => a + Number(s.total || 0), 0);
    const totalPaid = custSales.reduce((a, s) => a + Number(s.amount_paid || 0), 0);
    const balance = Math.max(0, totalSpent - totalPaid);
    return `
      <div class="item-card between">
        <div class="avatar-circle avatar-blue">${esc((c.name || 'C').slice(0, 1).toUpperCase())}</div>
        <div class="grow">

function calcSaleTotal() {
  const q = Number(val('saleQty')) || 0;
  const p = Number(val('salePrice')) || 0;
  const tot = q * p;
  $('saleTotal').value = tot;
  if (!$('salePaid').value || Number($('salePaid').value) === 0) {
    $('salePaid').value = tot;
  }
}

function saveNewSale() {
  const item = val('saleItemName');
  const qty = Number(val('saleQty')) || 1;
  const price = Number(val('salePrice')) || 0;
  const total = qty * price;
  if (!item || total <= 0) {
    toast('Please enter the item and a valid price.');
    return;
  }

  const custId = val('saleCustomer');
  let custName = val('saleWalkInName') || 'Walk-in Customer';
  if (custId) {
    const found = Store.data.customers.find(c => c.id === custId);
    if (found) custName = found.name;
  }

  const paid = Math.min(total, Number(val('salePaid')) || 0);
  const method = val('saleMethod');
  const date = val('saleDate') || new Date().toISOString().slice(0, 10);
  const notes = val('saleNotes') || null;

  let status = 'paid';
  if (paid === 0) status = 'unpaid';
  else if (paid < total) status = 'partial';

  const newSale = {
    id: uid(),
    customer_id: custId || null,
    customer_name: custName,
    items: [{ name: item, qty, price }],
    total,
    amount_paid: paid,
    payment_method: method,
    status,
    date,
    notes,
    created_at: new Date().toISOString(),
    payments: paid > 0 ? [{ id: uid(), amount: paid, paid_on: date, method, note: 'Initial payment' }] : []
  };

  Store.data.sales.unshift(newSale);
  Store.save();
  closeModal();
  toast('Sale recorded!');
  render();
}

          <div class="stat-val">${money(balance)}</div>
        </div>

        <div class="field">

          <input id="collectAmt" type="number" min="1" max="${balance}" value="${balance}">
        </div>

        <div class="field">

          <select id="collectMethod">
            <option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="POS / Card">POS / Card</option>

function saveCollectedSaleBalance(saleId) {
  const s = Store.data.sales.find(x => x.id === saleId);
  if (!s) return;
  const amt = Number(val('collectAmt'));
  if (!amt || amt <= 0) { toast('Please enter a valid amount.'); return; }

  s.amount_paid = Number(s.amount_paid || 0) + amt;
  if (s.amount_paid >= Number(s.total)) {
    s.status = 'paid';
  } else {
    s.status = 'partial';
  }

  if (!s.payments) s.payments = [];
  s.payments.push({
    id: uid(),
    amount: amt,
    paid_on: val('collectDate') || new Date().toISOString().slice(0, 10),
    method: val('collectMethod') || 'Cash',
    note: 'Balance installment'
  });

  Store.save();
  closeModal();
  toast('Payment recorded and balance updated!');
  render();
}

function handleCustomerCsvFileSelect(event) {
  const file = event.target.files?.[0];

    const pasteBox = $('customerCsvPasteText');
    if (pasteBox) pasteBox.value = text;

  };
  reader.readAsText(file);
}

function handleCustomerCsvTextChange(rawText) {
  const contacts = parseCustomerCSV(rawText);
  renderCustomerCsvPreview(contacts);
}

function parseCustomerCSV(text) {
  if (!text || !text.trim()) return [];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];

  function splitRow(row) {
    const res = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '"') {
        if (inQuotes && row[i+1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        res.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    res.push(cur.trim());
    return res;
  }

  const rawRows = lines.map(splitRow);
  if (!rawRows.length) return [];

  // Inspect first row for column headers
  const first = rawRows[0].map(h => (h || '').toLowerCase().replace(/[^a-z0-9]/g, ''));
  let nameIdx = -1, phoneIdx = -1, addrIdx = -1, notesIdx = -1;

  first.forEach((h, idx) => {
    if (h.includes('name') || h === 'customer' || h === 'contact') nameIdx = idx;
    else if (h.includes('phone') || h.includes('tel') || h.includes('mobile')) phoneIdx = idx;
    else if (h.includes('address') || h.includes('city') || h.includes('location') || h.includes('state')) addrIdx = idx;
    else if (h.includes('note') || h.includes('remark')) notesIdx = idx;
  });

  let dataRows = rawRows;
  if (nameIdx !== -1) {
    // Header row detected
    dataRows = rawRows.slice(1);
  } else {
    // No explicit headers: default to 0 = Name, 1 = Phone, 2 = Address
    nameIdx = 0;
    phoneIdx = 1;
    addrIdx = 2;
  }

  const parsed = [];
  dataRows.forEach(cols => {
    const name = (cols[nameIdx] || '').trim();
    if (!name) return;
    const phone = phoneIdx !== -1 ? (cols[phoneIdx] || '').trim() : '';
    const address = addrIdx !== -1 ? (cols[addrIdx] || '').trim() : '';
    const notes = notesIdx !== -1 ? (cols[notesIdx] || '').trim() : '';
    parsed.push({
      name,
      phone: phone || null,
      address: address || null,
      notes: notes || null
    });
  });

  return parsed;
}

function renderCustomerCsvPreview(contacts) {
  pendingImportCustomers = contacts;
  const area = $('customerCsvPreviewArea');
  const btn = $('confirmCustomerImportBtn');
  if (!area || !btn) return;

  if (!contacts.length) {

  area.innerHTML = `

function executeCustomerCsvImport() {

let debtFilter = 'all';

function renderDebts() {
  updateNavActive('debts');

  const debts = Store.data.debts;
  const todayStr = new Date().toISOString().slice(0, 10);

  let owedToMe = 0;
  let iOwe = 0;
  let overdueCount = 0;

  debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const balance = Math.max(0, Number(d.original_amount || 0) - repaid);
    if (d.type === 'receivable') owedToMe += balance;
    else iOwe += balance;
    if (balance > 0 && d.due_date && d.due_date < todayStr) overdueCount++;
  });

  let filtered = debts;
  if (debtFilter === 'receivable') filtered = debts.filter(d => d.type === 'receivable');
  else if (debtFilter === 'payable') filtered = debts.filter(d => d.type === 'payable');
  else if (debtFilter === 'overdue') {
    filtered = debts.filter(d => {
      const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
      return (Number(d.original_amount || 0) - repaid) > 0 && d.due_date && d.due_date < todayStr;
    });
  }

  $('app').innerHTML = `
    <div class="card">
      <div class="row between">

          <div class="stat-label">Owed to You (Receivable)</div>
          <div class="stat-val">${money(owedToMe)}</div>
        </div>
        <div class="stat-box red">
          <div class="stat-label">You Owe (Payable)</div>
          <div class="stat-val">${money(iOwe)}</div>
        </div>
        <div class="stat-box ${overdueCount > 0 ? 'amber' : ''}">
          <div class="stat-label">Overdue Debts</div>
          <div class="stat-val">${overdueCount}</div>
        </div>
      </div>
    </div>

    <!-- Segmented Filter -->
    <div class="tab-bar">
      <button class="tab-btn ${debtFilter === 'all' ? 'active' : ''}" onclick="debtFilter='all';renderDebts();">All (${debts.length})</button>
      <button class="tab-btn ${debtFilter === 'receivable' ? 'active' : ''}" onclick="debtFilter='receivable';renderDebts();">Owed to Me</button>
      <button class="tab-btn ${debtFilter === 'payable' ? 'active' : ''}" onclick="debtFilter='payable';renderDebts();">I Owe</button>
      <button class="tab-btn ${debtFilter === 'overdue' ? 'active' : ''}" onclick="debtFilter='overdue';renderDebts();">Overdue (${overdueCount})</button>
    </div>

    <div class="list">
      ${renderDebtList(filtered, todayStr)}
    </div>
  `;
}

              amount: ${repaid},

              purpose: '${isReceivable ? 'Repayment to Me' : 'Repayment to Creditor'}'
            })">Statement</button>
            <button class="btn-danger btn-sm" onclick="confirmDeleteDebt('${d.id}')" title="Delete debt">Delete</button>

    (r.people || []).forEach(p => {
      const paid = (p.payments || []).reduce((a, x) => a + Number(x.amount || 0), 0);
      csv += `"Contribution: ${r.title}","${p.name}",${paid},"${r.end_date || 'Ongoing'}","Phone: ${p.phone || ''} | ${r.description || ''}"\n`;
    });
  });

  Store.data.sales.forEach(s => {
    csv += `"Sale","${s.customer_name}",${s.total},"${s.date} - ${s.status}","Paid: ${s.amount_paid} | ${s.payment_method}"\n`;
  });

  Store.data.expenses.forEach(e => {
    csv += `"Expense: ${e.category}","${e.description}",${e.amount},"${e.date}",""\n`;
  });

  Store.data.debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    csv += `"Debt (${d.type})","${d.person_name}",${d.original_amount},"${d.due_date || 'No date'}","Repaid: ${repaid}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `recordly_export_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  toast('CSV report downloaded!');
}

/**
 * 8. PUBLIC LINKS (VISITOR VIEW: #/p/:id and #/g/:id)
 */
async function renderPublicPerson(pid) {
  let p = null, r = null;
  Store.data.records.forEach(rec => {
    const found = (rec.people || []).find(x => x.id === pid);
    if (found) { p = found; r = rec; }
  });

  if (!p) {
    try {
      const { data, error } = await sb.rpc('get_person_view', { pid });
      if (!error && data) {
        p = { name: data.name, payments: data.payments || [] };
        r = { title: data.title, description: data.description, target: data.target, show_table: data.show_table };
      }
    } catch (e) {}
  }

  if (!p || !r) {
    $('app').innerHTML = `
      <div class="card empty-box">
        <h3>Link not found</h3>
        <p class="muted">This progress link might be invalid or deleted.</p>
        <button class="btn-primary" onclick="location.hash='#/'">Open Recordly</button>
      </div>
    `;
    return;
  }

  const pays = (p.payments || []).slice().sort((a, b) => (b.paid_on || '').localeCompare(a.paid_on || ''));
  const paid = pays.reduce((a, x) => a + Number(x.amount || 0), 0);
  const target = Number(r.target || 0);
  const pc = target ? Math.min(100, Math.round(paid / target * 100)) : 0;

  $('app').innerHTML = `
    <div class="card">
      <div class="pill">PERSONAL CONTRIBUTION PROGRESS</div>
      <h1 style="margin-top:8px;">${esc(p.name)}</h1>
      <p class="muted">${esc(r.title)}</p>

      ${r.description ? `
        <div class="banner banner-info" style="margin-top:8px;">
          <div>
            <b>Group Information:</b>
            <div style="margin-top:2px;">${esc(r.description)}</div>
          </div>
        </div>
      ` : ''}

      <div class="stat-box green" style="margin-top:14px;">
        <div class="stat-label">Total Amount Paid</div>
        <div class="stat-val">${money(paid)}</div>
        ${target ? `
          <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${pc}%"></div></div>
          <div class="small muted" style="margin-top:4px;">${pc}% completed · ${money(Math.max(0, target - paid))} remaining balance</div>
        ` : `<div class="small muted" style="margin-top:4px;">No fixed individual target set.</div>`}
      </div>
    </div>

    <div class="card">
      <div class="card-title">📜 Verified Payment History</div>
      ${pays.length ? `
        <div class="list" style="margin-top:10px;">
          ${pays.map(x => `
            <div class="item-card between">
              <div>
                <b>${money(x.amount)}</b>
                <div class="muted small">${esc(x.paid_on || 'Verified payment')} ${x.note ? `· ${esc(x.note)}` : ''}</div>
              </div>
              <span class="badge badge-green">Recorded</span>
            </div>
          `).join('')}
        </div>
      ` : `<div class="empty-box">No payments have been recorded for your account yet.</div>`}
    </div>

    <div style="text-align:center;margin-top:20px;">
      <button class="btn-primary" onclick="location.hash='#/'">Manage Your Own Records with Recordly</button>
    </div>
  `;
}

/**
 * MASTER ROUTER
 */
async function render() {
  setTop();
  try {
    const p = hash();
    if (p[0] === 'p' && p[1]) return await renderPublicPerson(p[1]);
    if (p[0] === 'g' && p[1]) return await renderPublicGroup(p[1]);
    if (p[0] === 'contributions') {
      if (p[1] === 'new') return newRecordForm();
      return renderContributions();
    }
    if (p[0] === 'r' && p[1]) {
      if (p[2]) return renderMemberAdmin(p[1], p[2]);
      return renderRecordDetail(p[1]);
    }
    if (p[0] === 'business') return renderBusiness();
    if (p[0] === 'debts') return renderDebts();
    if (p[0] === 'reports') return renderReports();
    if (p[0] === 'more') return renderMore();
    if (p[0] === 'notifications') return renderNotifications();

    return renderDashboard();
  } catch (e) {
    console.error('Render error:', e);
    $('app').innerHTML = `
      <div class="card empty-box">
        <h2>Something went wrong</h2>
        <p class="muted">${esc(e.message || String(e))}</p>
        <button class="btn-primary" onclick="location.hash='#/'">Go to Dashboard</button>
      </div>
    `;
  }
}

async function start() {
  initTheme();
  Store.init();

  try {
    const { data } = await sb.auth.getSession();
    user = data?.session?.user || null;
    sb.auth.onAuthStateChange((event, session) => {
      user = session?.user || null;
      setTop();
      render();
      if (user) {
        syncLocalDataToSupabase({ silent: true });
      }
    });
  } catch (e) {
    console.warn('Supabase auth offline fallback:', e);
  }

  // Start periodic cloud sync every 45 seconds
  startPeriodicCloudSync(45000);

  // Sync when browser reconnects to internet
  window.addEventListener('online', () => {
    syncLocalDataToSupabase({ silent: true });
  });

  window.addEventListener('hashchange', render);
  await render();

  if (user) {
    syncLocalDataToSupabase({ silent: true });
  }
}

start();
