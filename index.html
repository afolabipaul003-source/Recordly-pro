<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Recordly — Simple records, clear progress</title>
<meta name="description" content="Simple records, clear progress. Track contributions, business sales, expenses, and debts with private progress links and instant receipts.">
<meta property="og:title" content="Recordly — Simple records, clear progress">
<meta property="og:description" content="Simple records, clear progress. Track contributions, business sales, expenses, and debts with private progress links and instant receipts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #0f766e;
  --primary-dark: #115e59;
  --primary-light: #ccfbf1;
  --accent-blue: #2563eb;
  --accent-blue-light: #dbeafe;
  --accent-amber: #d97706;
  --accent-amber-light: #fef3c7;
  --accent-red: #e11d48;
  --accent-red-light: #ffe4e6;
  --accent-purple: #7c3aed;
  --accent-purple-light: #ede9fe;
  --box-bg: #f8fafc;
  --header-bg: rgba(244, 246, 251, 0.95);
  --modal-bg: #ffffff;
  --input-bg: #ffffff;
  --input-border: #cbd5e1;
  --radius: 16px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
  --shadow: 0 8px 24px rgba(15,23,42,0.06);
  --shadow-lg: 0 18px 40px rgba(15,23,42,0.12);
}

[data-theme="dark"] {
  --bg: #0b0f19;
  --card: #151e2e;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #24324a;
  --primary: #14b8a6;
  --primary-dark: #0d9488;
  --primary-light: #133938;
  --accent-blue: #3b82f6;
  --accent-blue-light: #1e293b;
  --accent-amber: #f59e0b;
  --accent-amber-light: #2d2617;
  --accent-red: #f43f5e;
  --accent-red-light: #3b1722;
  --accent-purple: #a855f7;
  --accent-purple-light: #2e1d4d;
  --box-bg: #0f172a;
  --header-bg: rgba(11, 15, 25, 0.95);
  --modal-bg: #151e2e;
  --input-bg: #0f172a;
  --input-border: #334155;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 18px 40px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14.5px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 78px;
  transition: background 0.2s ease, color 0.2s ease;
}

@media (min-width: 768px) {
  body { padding-bottom: 30px; }
}

/* Layout */
.app-container {
  max-width: 940px;
  margin: 0 auto;
  padding: 12px 16px;
}
@media (min-width: 650px) {
  .app-container { padding: 20px 24px; }
}

/* Top bar */
.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0 14px;
  position: sticky;
  top: 0;
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  z-index: 20;
}
.brand-group { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 19px;
  box-shadow: 0 4px 10px rgba(15,118,110,0.25);
}
.brand-text { font-size: 21px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; }
.brand-text span { color: var(--primary); }
.brand-tag { font-size: 11px; color: var(--muted); font-weight: 500; }

.header-actions { display: flex; align-items: center; gap: 6px; }

/* Buttons & Inputs */
button, input, textarea, select { font: inherit; }
button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 8px 13px;
  font-weight: 600;
  background: var(--box-bg);
  color: var(--text);
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.55; cursor: wait; }

.btn-primary { background: var(--primary); color: #fff; border: none; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-soft { background: var(--primary-light); color: var(--primary); border: none; }
.btn-danger { background: var(--accent-red-light); color: var(--accent-red); border: none; }
.btn-danger:hover { background: #fecdd3; }
.btn-amber { background: var(--accent-amber-light); color: var(--accent-amber); border: none; }
.btn-blue { background: var(--accent-blue-light); color: var(--accent-blue); border: none; }
.btn-outline { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn-outline:hover { background: var(--box-bg); }
.btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 10px; }

/* Navigation bottom bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  box-shadow: 0 -4px 16px rgba(15,23,42,0.04);
}
@media (min-width: 768px) {
  .bottom-nav {
    position: static;
    border-radius: 14px;
    border: 1px solid var(--line);
    margin-bottom: 20px;
    padding: 6px;
    box-shadow: var(--shadow-sm);
  }
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 600;
  gap: 3px;
  flex: 1;
  max-width: 110px;
  border: none;
}
.nav-item.active {
  color: var(--primary);
  background: var(--primary-light);
}
.nav-item svg { width: 19px; height: 19px; stroke-width: 2.2; }

/* Cards & Layout */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
@media (min-width: 650px) {
  .card { padding: 20px; margin-bottom: 18px; }
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

h1, h2, h3, p { margin-top: 0; }
h1 { font-size: 23px; line-height: 1.25; letter-spacing: -0.5px; }
h2 { font-size: 17px; margin-bottom: 10px; font-weight: 700; }
h3 { font-size: 15px; margin-bottom: 6px; font-weight: 650; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

/* Metric Stat Box */
.stat-box {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--box-bg);
  border: 1px solid var(--line);
}
.stat-box .stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.stat-box .stat-val { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin-top: 3px; color: var(--text); }
.stat-box.green { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.3); }
.stat-box.green .stat-val { color: var(--primary); }
.stat-box.red { background: rgba(225,29,72,0.08); border-color: rgba(225,29,72,0.3); }
.stat-box.red .stat-val { color: var(--accent-red); }
.stat-box.blue { background: rgba(37,99,235,0.08); border-color: rgba(37,99,235,0.3); }
.stat-box.blue .stat-val { color: var(--accent-blue); }
.stat-box.amber { background: rgba(217,119,6,0.08); border-color: rgba(217,119,6,0.3); }
.stat-box.amber .stat-val { color: var(--accent-amber); }

/* Quick Actions */
.action-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}
@media (min-width: 600px) {
  .action-grid { grid-template-columns: repeat(4, 1fr); }
}
.action-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.15s ease;
}
.action-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.action-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 16px;
}

/* Badges & Pills */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1;
}
.badge-green { background: var(--primary-light); color: var(--primary); }
.badge-red { background: var(--accent-red-light); color: var(--accent-red); }
.badge-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
.badge-blue { background: var(--accent-blue-light); color: var(--accent-blue); }
.badge-gray { background: var(--box-bg); color: var(--muted); border: 1px solid var(--line); }

/* Progress bar */
.progress-track {
  height: 7px;
  background: var(--line);
  border-radius: 20px;
  overflow: hidden;
  margin: 6px 0;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, #0f766e);
  border-radius: 20px;
  transition: width 0.3s ease;
}

/* Lists and Items */
.list { display: grid; gap: 9px; }
.item-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  transition: border-color 0.15s ease;
}
.item-card:hover { border-color: #94a3b8; }
.avatar-circle {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
  flex-shrink: 0;
}
.avatar-blue { background: var(--accent-blue-light); color: var(--accent-blue); }
.avatar-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
.avatar-red { background: var(--accent-red-light); color: var(--accent-red); }

/* Tabs */
.tab-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px;
  background: var(--box-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  white-space: nowrap;
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
}
.tab-btn.active {
  background: var(--card);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(15,23,42,0.08);
}

/* Forms */
.field { margin: 12px 0; }
label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--muted); }
input, textarea, select {
  width: 100%;
  border: 1px solid var(--input-border);
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--input-bg);
  color: var(--text);
  outline: none;
  transition: all 0.15s ease;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15,118,110,0.2);
}

/* Modals & Overlays */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.7);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 100;
  animation: fadeIn 0.15s ease;
}
.modal-window {
  width: min(100%, 480px);
  max-height: 90vh;
  overflow-y: auto;
  background: var(--modal-bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow-lg);
  position: relative;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Toast */
.toast-msg {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  color: white;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 500;
  z-index: 200;
  box-shadow: var(--shadow-lg);
  max-width: 90%;
  text-align: center;
}
@media (min-width: 768px) {
  .toast-msg { bottom: 24px; }
}

/* Notice banners */
.banner {
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
}
.banner-info { background: var(--accent-blue-light); border: 1px solid var(--line); color: var(--accent-blue); }
.banner-warning { background: var(--accent-amber-light); border: 1px solid var(--line); color: var(--accent-amber); }
.banner-success { background: var(--primary-light); border: 1px solid var(--line); color: var(--primary); }

/* Empty state */
.empty-box {
  text-align: center;
  padding: 32px 16px;
  color: var(--muted);
  background: var(--box-bg);
  border-radius: 14px;
  border: 1px dashed var(--line);
}

/* Tables */
.table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }

/* Receipt Printable Styles */
.receipt-paper {
  background: #fff;
  color: #0f172a;
  border: 2px dashed #94a3b8;
  border-radius: 16px;
  padding: 24px;
  position: relative;
}
.receipt-paper::before {
  content: "OFFICIAL RECEIPT";
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #0f766e;
  border: 1px solid #0f766e;
  padding: 2px 6px;
  border-radius: 4px;
}
@media print {
  body { padding: 0; background: white; color: black; }
  .top-header, .bottom-nav, .no-print, button, #toastRoot { display: none !important; }
  .modal-overlay { position: static; background: none; padding: 0; }
  .modal-window { width: 100%; max-height: none; box-shadow: none; padding: 0; border: none; }
  .receipt-paper { border: 1px solid #000; }
}

.search-input {
  position: relative;
  margin-bottom: 12px;
}
.search-input input {
  padding-left: 36px;
}
.search-input svg {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--muted);
}
body.loggedout #bottomNav{display:none}
[hidden]{display:none!important}
.stat-box{min-width:0}
.stat-val,.fit-amt{white-space:nowrap;overflow:hidden}
#cloudSyncBtn{display:none!important}

/* mobile fit + simple home */
html,body{overflow-x:hidden}
.nav-item{min-width:0;padding:5px 2px;font-size:10.5px;max-width:none}
.bottom-nav{padding-left:2px;padding-right:2px}
.nav-item span{white-space:nowrap}
@media(max-width:480px){.brand-tag{display:none}}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 4px;border-radius:16px;color:#fff;text-align:center;border:0;min-width:0}
.big-btn .bi{font-size:28px;line-height:1.1}.big-btn b{font-size:14px}.big-btn small{font-size:11px;opacity:.9;line-height:1.2}
.big-btn.b1{background:#0f766e}.big-btn.b2{background:#1d4ed8}.big-btn.b3{background:#b45309}
.mini-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hint-box{display:flex;gap:10px;align-items:flex-start;background:var(--primary-light);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.hint-box>div{flex:1;min-width:0}
.wiz-dots{display:flex;gap:6px;margin-bottom:8px}.wiz-dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.wiz-dots i.on{background:var(--primary)}
.big-btn{min-height:104px;justify-content:center}.big-btn b{font-size:13px}
.hint-box{font-size:13px}.hint-box button{align-self:center}
.card table{max-width:100%}
@media(max-width:600px){
  .grid-2{grid-template-columns:1fr}
  table{display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
  .modal-window{padding:16px}
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="brand-group" onclick="location.hash='#/'">
      <div class="brand-icon">R</div>
      <div>
        <div class="brand-text">Record<span>ly</span></div>
        <div class="brand-tag">Records · Business · Control</div>
      </div>
    </div>
    <div class="header-actions" id="headerActions">
      <!-- Cloud Sync Status Pill -->
      <button class="btn-outline btn-sm" id="cloudSyncBtn" onclick="syncLocalDataToSupabase({ silent: false })" title="Supabase Cloud Backup status (click to sync now)">
        <span id="cloudSyncBadge" class="badge badge-gray" style="font-size:11px;padding:2px 6px;">☁️ Sync</span>
      </button>

      <!-- Universal Search Button -->
      <button class="btn-outline btn-icon" onclick="openGlobalSearch()" title="Search all records & transactions">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>

      <!-- Dark / Light Theme Toggle -->
      <button class="btn-outline btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark / Light Mode">
        <span id="themeIcon">🌙</span>
      </button>

      <!-- Hide / show amounts on this screen -->
      <button class="btn-outline btn-icon" id="maskToggleBtn" onclick="toggleMask()" title="Hide or show amounts on my screen">
        <span id="maskIcon">👁️</span>
      </button>

      <!-- Reminders Bell -->
      <button class="btn-outline btn-icon" onclick="location.hash='#/notifications'" id="notifBell" title="Reminders & Alerts" style="position:relative;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notifCountBadge" style="display:none;position:absolute;top:3px;right:3px;width:8px;height:8px;background:var(--accent-red);border-radius:50%"></span>
      </button>

      <div id="authPill"></div>
    </div>
  </header>

  <!-- Bottom Navigation for Phones / Top bar on desktop -->
  <nav class="bottom-nav no-print" id="bottomNav">
    <button class="nav-item active" onclick="location.hash='#/'" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="location.hash='#/contributions'" id="nav-contributions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Groups</span>
    </button>

const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0Y2R5d3VjZnBibm9jeGx4b29nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDg3MzMsImV4cCI6MjEwODMyNDczM30.UQSzIfYXD5EOaypvzARTk3gWv1OGJf9kcxkP7XJKBuk';

  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {

}
function runWordConfirm() {
  if ((($('pwConfirm') || {}).value || '').trim().toUpperCase() !== 'CONFIRM') { $('pwErr').textContent = 'Type the word CONFIRM exactly.'; return; }
  const f = window._pwOk; closeModal(); if (f) f();
}
async function runPwConfirm() {
  const pw = ($('pwConfirm') || {}).value || '';

  const b = $('pwGo'); b.disabled = true; b.textContent = 'Checking…';
  try {
    const { error } = await sb.auth.signInWithPassword({ email: user.email, password: pw });
    if (error) { $('pwErr').textContent = 'Wrong password.'; b.disabled = false; b.textContent = 'Confirm'; return; }
  } catch (e) { $('pwErr').textContent = 'Could not verify. Check your connection.'; b.disabled = false; b.textContent = 'Confirm'; return; }
  const f = window._pwOk; closeModal(); if (f) f();
}

let liveChan = null, liveAlerts = [];
try { liveAlerts = JSON.parse(localStorage.getItem('rc_alerts') || '[]'); } catch (e) {}
function playPing() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(c.currentTime + 0.2); } catch (e) {}
}
function pushAlert(title, desc, link, key) {
  liveAlerts.unshift({ title, desc, link: link || '#/notifications', at: Date.now(), key: key || null });
  liveAlerts = liveAlerts.slice(0, 30);
  try { localStorage.setItem('rc_alerts', JSON.stringify(liveAlerts)); } catch (e) {}
  playPing(); toast(title);
  const b = $('notifCountBadge'); if (b) b.style.display = 'block';
}
function startLiveAlerts() {
  if (liveChan) { try { sb.removeChannel(liveChan); } catch (e) {} liveChan = null; }
  if (!user) return;
  liveChan = sb.channel('live-' + user.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'payments' }, async m => {
      const x = m.new;
      const mine = (Store.data.records || []).some(r => (r.people || []).some(pp => (pp.payments || []).some(y => y.id === x.id)));
      if (mine) return;
      let who = '';
      try { const { data } = await sb.rpc('get_person_view', { pid: x.person_id }); if (data) who = ' for ' + data.title; } catch (e) {}
      pushAlert('New payment of ' + money(x.amount) + ' recorded' + who, 'Recorded on ' + (x.paid_on || 'today'), '#/p/' + x.person_id);
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, m => {
      const c = m.new;
      if (c.author_id === user.id) return;
      pushAlert('New comment from ' + (c.author_name || 'someone'), String(c.body || '').slice(0, 80), '#/p/' + c.person_id);
    })
    .subscribe();
}

function miniModal(title, inner) {
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-window" style="max-width:440px;max-height:85vh;overflow:auto;"><div class="row between" style="margin-bottom:10px;"><h2>${esc(title)}</h2><button class="btn-outline btn-icon" onclick="closeModal()">✕</button></div>${inner}</div></div>`;

let qpList = [];
function quickLogPayment() {
  qpList = [];
  (Store.data.records || []).forEach(r => (r.people || []).forEach(p => qpList.push({ rid: r.id, pid: p.id, name: p.name || 'Member', title: r.title })));

}
function shareWA(path) {
  window.open('https://wa.me/?text=' + encodeURIComponent((path.indexOf('j/') === 0 ? 'You are invited to join my group on Recordly. Tap to ask to join: ' : 'Check your payment progress here: ') + link(path)), '_blank');
}
function quickShareLink() {
  const recs = Store.data.records || [];
  if (!recs.length) return needRecordModal('Share a link');
  const row = (label, path) => `<div class="row between" style="padding:8px 0;border-top:1px solid var(--line);"><span>${esc(label)}</span><span class="row"><button class="btn-soft btn-sm" onclick="copyText('${link(path)}')">Copy</button><button class="btn-primary btn-sm" onclick="shareWA('${path}')">WhatsApp</button></span></div>`;
  const inner = recs.map(r => `<div class="card" style="padding:12px;margin-bottom:10px;"><b>${esc(r.title)}</b>${row('Invite link (they ask to join)', 'j/' + r.id + '/invite')}${r.group_link ? row('Group link (everyone)', 'g/' + r.id) : '<div class="muted small" style="margin-top:4px;">Group link is off for this record.</div>'}${(r.people || []).map(p => row(p.name || 'Member', 'p/' + p.id)).join('')}</div>`).join('');
  $('modalRoot').innerHTML = miniModal('Send a progress link', `<p class="muted small" style="margin-top:0;">Each person gets their own link. Tap WhatsApp to send it.</p>${inner}`);
}
const HINTS = {
  '': 'Start here: tap New record, add the people who will pay, then tap Log payment each time someone pays you. Tap Share link so they can follow their progress.',
  contributions: 'A record is one thing you collect money for, like dues or a product paid in instalments. Tap a record to add people and log payments.',
  record: 'Add the people paying. Tap a person to log a payment or get their own link. Turn on the group link to share one link with everyone.',
  member: 'Log each payment here after the person pays you. Their progress updates on their link straight away.',
  business: 'Keep track of what you sell, your customers and what they still owe you.',
  debts: 'Write down money people owe you, or money you owe. Log each repayment when it happens.',
  reports: 'Totals for your records: what came in, what is still owed and what you spent.',
  more: 'Settings, the user guide and other tools.',
  notifications: 'New payments, comments and deadlines show up here.'
};
function addPageHint() {
  const p = hash();
  if (!user || p[0] === 'p' || p[0] === 'g' || (p[0] === 'contributions' && p[1] === 'new')) return;
  const key = p[0] === 'r' ? (p[2] ? 'member' : 'record') : (p[0] || '');
  const h = HINTS[key]; if (!h) return;
  try { if (localStorage.getItem('rc_hint_' + key)) return; } catch (e) {}
  const app = $('app'); if (!app || app.querySelector('.hint-box')) return;
  const d = document.createElement('div');
  d.className = 'hint-box';
  d.innerHTML = `<span>💡</span><div>${esc(h)}</div><button class="btn-soft btn-sm" onclick="dismissHint('${key}',this)">Got it</button>`;
  app.insertBefore(d, app.firstChild);
}
function dismissHint(k, el) { try { localStorage.setItem('rc_hint_' + k, '1'); } catch (e) {} el.closest('.hint-box').remove(); }
async function render() { await renderCore(); addPageHint(); }

    <div class="card">

      <h1 style="margin-top:12px;">Know what came in, what is due, and what remains.</h1>

      <div class="row" style="margin-top:14px;">

        <button class="btn-outline" onclick="authModal('login')">Log in</button>

    <div class="card">
      <b>Did a seller send you a link?</b>

    </div>`;

async function loadAccountData() {
  if (!user || loadingFor === user.id) return;
  loadingFor = user.id;
  try {
    if (Store.data.owner && Store.data.owner !== user.id) {
      Store.data = { records: [], customers: [], sales: [], expenses: [], debts: [], settings: { businessName: 'My Enterprise', onboarded: false } };
    }
    Store.data.owner = user.id;
    const SEL_BASE = 'id,title,description,target,end_date,show_table,group_link,created_at,people(id,name,phone,payments(id,amount,paid_on,note))';
    const SEL_EXT = 'id,title,description,target,end_date,show_table,group_link,hide_balance,discoverable,created_at,people(id,name,phone,payments(id,amount,paid_on,paid_at,method,payer_name,payer_phone,note))';
    let qres = await sb.from('records').select(SEL_EXT).order('created_at');
    if (qres.error) { qres = await sb.from('records').select(SEL_BASE).order('created_at'); extOk = false; } else { extOk = true; }
    const { data, error } = qres;
    if (!error && data) {
      data.forEach(r => {
        let loc = (Store.data.records || []).find(x => x.id === r.id);
        const dbPeople = (r.people || []).map(p => ({ id: p.id, name: p.name, phone: p.phone || '', payments: (p.payments || []).map(x => ({ id: x.id, amount: Number(x.amount), paid_on: x.paid_on, paid_at: x.paid_at || null, method: x.method || null, payer_name: x.payer_name || null, payer_phone: x.payer_phone || null, note: x.note || '' })) }));
        if (!loc) {
          Store.data.records.push({ id: r.id, title: r.title, description: r.description || '', target: r.target, end_date: r.end_date, show_table: r.show_table, group_link: r.group_link, hide_balance: !!r.hide_balance, discoverable: !!r.discoverable, created_at: r.created_at, people: dbPeople });
        } else {
          Object.assign(loc, { title: r.title, description: r.description || '', target: r.target, end_date: r.end_date, show_table: r.show_table, group_link: r.group_link, hide_balance: !!r.hide_balance, discoverable: !!r.discoverable });
          loc.people = loc.people || [];
          dbPeople.forEach(dp => {
            const lp = loc.people.find(x => x.id === dp.id);
            if (!lp) { loc.people.push(dp); return; }
            lp.name = dp.name; lp.phone = dp.phone || lp.phone;
            lp.payments = lp.payments || [];
            dp.payments.forEach(dx => { if (!lp.payments.find(x => x.id === dx.id)) lp.payments.push(dx); });
          });
        }
      });
    }
    const d = Store.data;
    if (!(d.customers.length || d.sales.length || d.expenses.length || d.debts.length)) {
      let b = null;
      try { const u = await sb.auth.getUser(); b = u.data?.user?.user_metadata?.recordly_backup || null; } catch (e) {}
      if (!b) { try { const t = await sb.from('user_backups').select('backup').eq('user_id', user.id).maybeSingle(); if (t.data?.backup) b = t.data.backup; } catch (e) {} }
      if (b) {
        ['customers', 'sales', 'expenses', 'debts'].forEach(k => { if (Array.isArray(b[k])) d[k] = b[k]; });
        if (b.settings) d.settings = Object.assign({}, d.settings, b.settings);
      }
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
  } catch (e) {
    console.warn('Could not load account data', e);
  }
  loadedFor = user ? user.id : null;
  try { if (user && localStorage.getItem('rc_newuser') === user.email) { localStorage.removeItem('rc_newuser'); setTimeout(showOnboardingGuide, 500); } } catch (e) {}
  startLiveAlerts();
  startInboxLive();
  loadInbox();
  upsertProfile();
  softRender();
}

async function syncRecordsToDb() {
  if (!user || loadedFor !== user.id) return;
  if (dbSyncBusy) { dbSyncAgain = true; return; }
  dbSyncBusy = true;
  try {
    const recs = (Store.data.records || []).filter(r => !/^rec_/.test(r.id));
    let changed = false;
    recs.forEach(r => {
      if (!UUID_RE.test(r.id)) { r.id = uid(); changed = true; }
      (r.people || []).forEach(p => {
        if (!UUID_RE.test(p.id)) { p.id = uid(); changed = true; }
        (p.payments || []).forEach(x => { if (!UUID_RE.test(x.id)) { x.id = uid(); changed = true; } });
      });
    });
    if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
    const today = localDate();
    const recRows = recs.map(r => ({ id: r.id, owner_id: user.id, title: r.title || 'Untitled', description: r.description || null, target: r.target ? Number(r.target) : null, end_date: r.end_date || null, show_table: !!r.show_table, group_link: !!r.group_link, hide_balance: !!r.hide_balance, discoverable: !!r.discoverable }));
    const peopleRows = [], payRows = [];
    recs.forEach(r => (r.people || []).forEach(p => {
      peopleRows.push({ id: p.id, record_id: r.id, name: p.name || 'Member', phone: p.phone || null });
      (p.payments || []).forEach(x => { if (Number(x.amount) > 0) payRows.push({ id: x.id, person_id: p.id, amount: Number(x.amount), paid_on: x.paid_on || today, note: x.note || null, paid_at: x.paid_at || null, method: x.method || null, payer_name: x.payer_name || null, payer_phone: x.payer_phone || null }); });
    }));
    const sig = JSON.stringify([user.id, recRows, peopleRows, payRows]);
    if (sig !== dbSyncSig || changed) {
      let res;
      await upsertSafe('records', recRows, ['hide_balance', 'discoverable']);
      if (peopleRows.length) { res = await sb.from('people').upsert(peopleRows); if (res.error) throw res.error; }
      await upsertSafe('payments', payRows, ['paid_at', 'method', 'payer_name', 'payer_phone']);
      const sy = Object.assign({ r: [], p: [], x: [] }, Store.data.synced || {});
      const L = { r: new Set(recRows.map(a => a.id)), p: new Set(peopleRows.map(a => a.id)), x: new Set(payRows.map(a => a.id)) };
      const gone = k => sy[k].filter(id => !L[k].has(id));
      const gx = gone('x'); if (gx.length) await sb.from('payments').delete().in('id', gx);
      const gp = gone('p'); if (gp.length) await sb.from('people').delete().in('id', gp);
      const gr = gone('r'); if (gr.length) await sb.from('records').delete().in('id', gr);
      Store.data.synced = { r: [...L.r], p: [...L.p], x: [...L.x] };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
      dbSyncSig = sig;
    }
    if (changed) softRender();
  } catch (e) {
    console.warn('Database sync problem', e);
    if (!dbSyncWarned) { dbSyncWarned = true; toast('Could not save online: ' + (e.message || e)); }
  }
  dbSyncBusy = false;
  if (dbSyncAgain) { dbSyncAgain = false; scheduleDbSync(); }
}

/**
 * SUPABASE CLOUD BACKUP & PERIODIC SYNC ENGINE
 */
let lastBackupSig = '';
let cloudSyncStatus = 'idle'; // 'idle', 'syncing', 'synced', 'error', 'offline_local'
let lastCloudSyncTime = localStorage.getItem('recordly_last_sync') || null;
let syncDebounceTimer = null;
let periodicSyncTimer = null;

function scheduleDebouncedCloudSync() {
  if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => {
    syncLocalDataToSupabase({ silent: true });
  }, 2500);
}

function startPeriodicCloudSync(intervalMs = 45000) {
  if (periodicSyncTimer) clearInterval(periodicSyncTimer);
  periodicSyncTimer = setInterval(() => {
    syncLocalDataToSupabase({ silent: true });
  }, intervalMs);
}

async function syncLocalDataToSupabase(options = { silent: true }) {
  if (!user) {
    cloudSyncStatus = 'offline_local';
    updateSyncStatusBadge();
    if (!options.silent) {
      toast('Sign in with Supabase to enable cloud backup.');
      authModal('login');
    }
    return;
  }
  if (loadedFor !== user.id) return; // wait until this account's data has been loaded

  cloudSyncStatus = 'syncing';
  updateSyncStatusBadge();

  try {
    const rawData = localStorage.getItem(STORAGE_KEY) || JSON.stringify(Store.data);
    const parsed = JSON.parse(rawData);
    const syncTimestamp = new Date().toISOString();

    const backupPayload = {
      records: parsed.records || [],
      customers: parsed.customers || [],
      sales: parsed.sales || [],
      expenses: parsed.expenses || [],
      debts: parsed.debts || [],
      settings: parsed.settings || {},
      version: 'v2',
      updated_at: syncTimestamp
    };

    const bsig = JSON.stringify([backupPayload.records, backupPayload.customers, backupPayload.sales, backupPayload.expenses, backupPayload.debts, backupPayload.settings]);
    if (bsig === lastBackupSig) { cloudSyncStatus = 'synced'; updateSyncStatusBadge(); return; }

    // 1. Primary Cloud Backup into Supabase Auth User Metadata
    const { error: updateError } = await sb.auth.updateUser({
      data: {
        recordly_backup: backupPayload,
        recordly_last_synced: syncTimestamp
      }
    });

    if (updateError) {
      console.warn('Supabase auth metadata backup notice:', updateError);
    }

    // 2. Also try upserting to user_backups table if provisioned
    try {
      await sb.from('user_backups').upsert({
        user_id: user.id,
        backup: backupPayload,
        updated_at: syncTimestamp
      }, { onConflict: 'user_id' });
    } catch (tblErr) {}

    lastBackupSig = bsig;
    cloudSyncStatus = 'synced';
    lastCloudSyncTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    localStorage.setItem('recordly_last_sync', lastCloudSyncTime);

    if (!options.silent) {
      toast(`Cloud backup synced to Supabase (${lastCloudSyncTime})!`);
      if (currentTab === 'more') renderMore();
    }
    updateSyncStatusBadge();
  } catch (err) {
    console.error('Cloud sync failure:', err);
    cloudSyncStatus = 'error';
    updateSyncStatusBadge();
    if (!options.silent) {
      toast('Cloud sync failed: ' + (err.message || 'Network error'));
    }
  }
}

async function restoreFromSupabaseBackup() {
  if (!user) {
    toast('Please sign in to restore your cloud backup.');
    authModal('login');
    return;
  }

  toast('Checking cloud backup on Supabase...');
  try {
    const { data: userData } = await sb.auth.getUser();
    let backup = userData?.user?.user_metadata?.recordly_backup || user?.user_metadata?.recordly_backup;

    if (!backup) {
      try {
        const { data: tblData } = await sb.from('user_backups').select('backup').eq('user_id', user.id).single();
        if (tblData?.backup) backup = tblData.backup;
      } catch (e) {}
    }

    if (!backup) {
      toast('No cloud backup found on your Supabase account.');
      return;
    }

    const recCount = (backup.records || []).length;
    const custCount = (backup.customers || []).length;
    const salesCount = (backup.sales || []).length;
    const debtCount = (backup.debts || []).length;
    const backupDate = backup.updated_at ? new Date(backup.updated_at).toLocaleString() : 'Recent';

    if (confirm(`Cloud backup found from ${backupDate}:\n• ${recCount} Groups\n• ${custCount} Customers\n• ${salesCount} Sales\n• ${debtCount} Debts\n\nRestore this cloud backup to your device?`)) {
      Store.data = {
        records: backup.records || [],
        customers: backup.customers || [],
        sales: backup.sales || [],
        expenses: backup.expenses || [],
        debts: backup.debts || [],
        settings: backup.settings || { businessName: 'My Enterprise', onboarded: true }
      };
      Store.save();
      toast('Cloud backup restored successfully!');
      render();
    }
  } catch (err) {
    toast('Restore failed: ' + (err.message || 'Error'));
  }
}

function updateSyncStatusBadge() {
  const badge = $('cloudSyncBadge');
  if (!badge) return;
  if (!user) {
    badge.className = 'badge badge-gray';
    badge.innerHTML = '☁️ Local';
    badge.title = 'Local only. Sign in to backup to Supabase';
  } else if (cloudSyncStatus === 'syncing') {
    badge.className = 'badge badge-amber';
    badge.innerHTML = '☁️ Syncing...';
    badge.title = 'Backing up to Supabase';
  } else if (cloudSyncStatus === 'error') {
    badge.className = 'badge badge-red';
    badge.innerHTML = '☁️ Sync Error';
    badge.title = 'Last backup attempt failed';
  } else {
    badge.className = 'badge badge-green';

    badge.title = `Auto-sync active. Last synced: ${lastCloudSyncTime || 'Just now'}`;
  }
}

function checkReminders() {
  const notifs = liveAlerts.map(a => ({ type: 'info', title: a.title, desc: a.desc, link: a.link }));
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);

  // 1. Overdue debts
  Store.data.debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const balance = Number(d.original_amount || 0) - repaid;
    if (balance > 0 && d.due_date && d.due_date < todayStr) {
      notifs.push({
        type: 'danger',
        title: `Overdue ${d.type === 'receivable' ? 'Receivable' : 'Payable'}: ${d.person_name}`,
        desc: `${money(balance)} was due on ${d.due_date}.`,
        link: '#/debts'
      });
    }
  });

  // 2. Upcoming contribution deadlines
  Store.data.records.forEach(r => {
    if (r.end_date) {
      const diffDays = Math.ceil((new Date(r.end_date) - now) / (1000 * 60 * 60 * 24));
      if (diffDays >= 0 && diffDays <= 7) {
        notifs.push({
          type: 'warning',
          title: `Deadline Approaching: ${r.title}`,
          desc: `Closes in ${diffDays === 0 ? 'today' : diffDays + ' days'} (${r.end_date}).`,
          link: `#/r/${r.id}`
        });
      }
    }
  });

  const badge = $('notifCountBadge');
  if (badge) {
    if (notifs.length > 0 || (inbox.joins || []).some(j => j.status === 'pending')) badge.style.display = 'block';
    else badge.style.display = 'none';
  }

  return notifs;
}

        <label for="otpPhone">Mobile Phone Number</label>
        <input id="otpPhone" type="tel" placeholder="+234 801 234 5678 or 08012345678" value="${pendingOtpTarget}">
      </div>
      <button class="btn-primary" style="width:100%;padding:11px;" id="sendPhoneOtpBtn">

      </button>
      <div class="row between" style="margin-top:14px;">
        <a href="#" onclick="event.preventDefault();authModal('login');" class="small" style="color:var(--muted);">← Back to Password Login</a>
        <a href="#" onclick="event.preventDefault();authModal('gmail_otp');" class="small" style="color:var(--primary);">Use Gmail instead</a>
      </div>

        <label for="otpToken">Enter 6-Digit Code</label>

      </div>
      <button class="btn-primary" style="width:100%;padding:11px;" id="verifyOtpBtn">
        Verify & Sign In
      </button>
      <div class="row between" style="margin-top:14px;">
        <a href="#" onclick="event.preventDefault();authModal(pendingOtpType === 'phone' ? 'phone_otp' : 'gmail_otp');" class="small" style="color:var(--muted);">Change ${pendingOtpType === 'phone' ? 'Number' : 'Email'}</a>
        <button class="btn-outline btn-sm" onclick="resendOtp()">Resend Code</button>
      </div>
    `;
  } else if (mode === 'forgot') {
    bodyHtml = `
      <p class="muted small">Enter your registered email address to receive password reset instructions and a reset code.</p>
      <div class="field">
        <label for="resetEmail">Email Address</label>
        <input id="resetEmail" type="email" placeholder="you@gmail.com">
      </div>
      <button class="btn-primary" style="width:100%;padding:11px;" id="sendResetBtn">
        Send Password Reset Link
      </button>
      <p class="muted small" style="margin-top:14px;text-align:center;">
        Remember your password?
        <a href="#" onclick="event.preventDefault();authModal('login');" style="color:var(--primary);font-weight:700;">Log in</a>
      </p>
    `;
  } else if (mode === 'set_new_password') {
    bodyHtml = `
      <div class="banner banner-success" style="font-size:12.5px;">
        Reset code verified. Please choose a new password.
      </div>
      <div class="field">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" placeholder="At least 6 characters">
      </div>
      <button class="btn-primary" style="width:100%;padding:11px;" id="saveNewPassBtn">
        Update Password & Sign In
      </button>
    `;
  }

  $('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-window">
        <div class="row between" style="margin-bottom:12px;">
          <h2>${mode === 'signup' ? 'Create Account' : mode === 'gmail_otp' ? 'Gmail OTP Login' : mode === 'phone_otp' ? 'Phone Number Login' : mode === 'forgot' ? 'Reset Password' : mode === 'verify_otp' ? 'Verify Code' : 'Welcome to Recordly'}</h2>

      }

      b.textContent = 'Please wait…';

        if (mode === 'signup') {
          result = await sb.auth.signUp({ email, password, options: { data: { name: val('authName') } } });

        b.textContent = mode === 'signup' ? 'Create Account' : 'Log In';

    };

        return;

      if (phone.startsWith('0') && phone.length === 11) {
        phone = '+234' + phone.slice(1);
      }
      pendingOtpTarget = phone;
      pendingOtpType = 'phone';
      const b = $('sendPhoneOtpBtn');
      b.disabled = true;
      b.textContent = 'Sending SMS…';

        await sb.auth.signInWithOtp({ phone });

        }
        if (res.data?.session?.user) {
          user = res.data.session.user;

            id: 'u_' + uid(),

      } catch (e) {}
      closeModal();
      toast('Password updated successfully! You are logged in.');
      render();
    };
  }
}

function resendOtp() {
  toast(`A new 6-digit code was sent to ${pendingOtpTarget}`);
}

function showAuthMsg(m) {
  const el = $('authMsg');

    el.style.display = 'flex';
  }
}

async function logout() {
  try { await syncRecordsToDb(); await syncLocalDataToSupabase({ silent: true }); } catch (e) {}
  try { await sb.auth.signOut(); } catch (e) {}
  user = null;
  Store.data = { records: [], customers: [], sales: [], expenses: [], debts: [], settings: { businessName: 'My Enterprise', onboarded: false } };

/**
 * GLOBAL SEARCH MODAL (Searches Contributions, Members, Sales, Customers, Debts)
 */
function openGlobalSearch() {
  $('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-window" style="max-height:85vh;">
        <div class="row between" style="margin-bottom:12px;">

        </div>

        <div class="search-input">

          <input id="globalSearchInput" placeholder="Type name, group title, sale item, or debt..." autofocus oninput="executeGlobalSearch()">
        </div>

        <div id="globalSearchResults" style="margin-top:14px;max-height:55vh;overflow-y:auto;">
          <p class="muted small" style="text-align:center;padding:20px 0;">Search across contributions, members, business sales, expenses, and debts.</p>
        </div>

      </div>

  setTimeout(() => $('globalSearchInput')?.focus(), 50);

function executeGlobalSearch() {
  const q = val('globalSearchInput').toLowerCase();
  const resEl = $('globalSearchResults');
  if (!q) {
    resEl.innerHTML = `<p class="muted small" style="text-align:center;padding:20px 0;">Start typing to search records...</p>`;
    return;
  }

  const results = [];

  // 1. Contribution records
  Store.data.records.forEach(r => {
    if ((r.title || '').toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Contribution Group',
        icon: '🤝',
        title: r.title,
        desc: `${(r.people || []).length} members ${r.description ? `· ${r.description.slice(0, 45)}...` : ''}`,
        link: `#/r/${r.id}`
      });
    }
    // Search members inside
    (r.people || []).forEach(p => {
      if ((p.name || '').toLowerCase().includes(q) || (p.phone || '').includes(q)) {
        results.push({
          type: 'Member',
          icon: '👤',
          title: p.name,
          desc: `In group: ${r.title} · ${p.phone || 'No phone'}`,
          link: `#/r/${r.id}/${p.id}`
        });
      }
    });
  });

  // 2. Sales
  Store.data.sales.forEach(s => {
    const itemNames = (s.items || []).map(i => i.name).join(' ');
    if ((s.customer_name || '').toLowerCase().includes(q) || itemNames.toLowerCase().includes(q) || (s.notes || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Business Sale',
        icon: '💰',
        title: `${s.customer_name} - ${money(s.total)}`,
        desc: `${itemNames} · ${s.date} (${s.status})`,
        link: `#/business`
      });
    }
  });

  // 3. Customers
  Store.data.customers.forEach(c => {
    if ((c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q) || (c.address || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Customer',
        icon: '🏢',
        title: c.name,
        desc: `${c.phone || 'No phone'} · ${c.address || 'Customer'}`,
        link: `#/business`
      });
    }
  });

  // 4. Debts
  Store.data.debts.forEach(d => {
    if ((d.person_name || '').toLowerCase().includes(q) || (d.notes || '').toLowerCase().includes(q)) {
      results.push({
        type: d.type === 'receivable' ? 'Receivable Debt' : 'Payable Debt',
        icon: '💳',
        title: `${d.person_name} - ${money(d.original_amount)}`,
        desc: `${d.type === 'receivable' ? 'Owed to you' : 'You owe'} ${d.due_date ? `· Due: ${d.due_date}` : ''}`,
        link: `#/debts`
      });
    }
  });

  if (!results.length) {
    resEl.innerHTML = `<div class="empty-box" style="padding:20px;">No matching records found for "${esc(q)}"</div>`;
    return;
  }

  resEl.innerHTML = `
    <div class="list">
      ${results.map(r => `
        <div class="item-card between" style="cursor:pointer;" onclick="closeModal();location.hash='${r.link}'">
          <div class="row">
            <span style="font-size:18px;">${r.icon}</span>
            <div>
              <div style="font-weight:700;">${esc(r.title)}</div>
              <div class="muted small">${esc(r.desc)}</div>
            </div>
          </div>
          <span class="badge badge-gray">${esc(r.type)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

/**
 * RECEIPT GENERATION ENGINE
 */
function receiptRef(id) { return 'RCP-' + String(id || '').replace(/[^a-z0-9]/gi, '').slice(-8).toUpperCase(); }
function fmtDateTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function payTimeTxt(x) {
  const d = x && x.paid_at ? new Date(x.paid_at) : null;
  return d && !isNaN(d) ? ' at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
}
function openPaymentReceipt(rid, pid, payId) {
  const r = Store.data.records.find(x => x.id === rid);
  const p = r?.people?.find(x => x.id === pid);
  const x = p?.payments?.find(y => y.id === payId);
  if (!x) return;
  openReceiptModal({
    title: r.title, receiptNo: x.ref || receiptRef(x.id), date: x.paid_on, at: x.paid_at || x.created_at || null,
    payer: x.payer_name || p.name, onBehalf: x.payer_name ? p.name : '', phone: x.payer_phone || p.phone || '',
    amount: x.amount, method: x.method || 'Cash', note: x.note || '', purpose: 'Contribution Payment'
  });
}
function openSaleReceipt(id) {
  const s = Store.data.sales.find(x => x.id === id); if (!s) return;
  const last = (s.payments || []).slice(-1)[0];
  openReceiptModal({
    title: (Store.data.settings.businessName || 'Business') + ' - Sales Receipt', receiptNo: s.ref || receiptRef(s.id),
    date: (last && last.paid_on) || s.date, at: (last && last.at) || s.created_at || null,
    payer: s.customer_name, amount: s.amount_paid, method: s.payment_method || 'Cash', note: s.notes || '',
    purpose: (s.items || []).map(i => i.name + (i.qty ? ' (x' + i.qty + ')' : '')).join(', ') || 'Sale Item'
  });
}
function openDebtReceipt(id) {
  const d = Store.data.debts.find(x => x.id === id); if (!d) return;
  const reps = d.repayments || [];
  const repaid = reps.reduce((a, r) => a + Number(r.amount || 0), 0);
  const last = reps.slice(-1)[0];
  openReceiptModal({
    title: 'Debt Statement / Receipt', receiptNo: d.ref || receiptRef(d.id),
    date: (last && last.date) || localDate(), at: (last && last.at) || null,
    payer: d.person_name, phone: d.phone || '', amount: repaid, method: 'Repayment', note: d.notes || '',
    purpose: d.type === 'receivable' ? 'Repayment to Me' : 'Repayment to Creditor'
  });
}

          </div>

          <div style="background:#f8fafc;padding:12px;border-radius:10px;text-align:center;margin:12px 0;">
            <div class="small muted">Amount Paid</div>
            <div class="fit-amt" style="font-size:26px;font-weight:900;color:#0f766e;margin-top:2px;">${moneyReal(o.amount)}</div>
          </div>

          <table style="margin:14px 0;">
            <tr><td class="muted">Date:</td><td><b>${esc(dateTxt)}</b></td></tr>
            ${timeRow ? `<tr><td class="muted">${esc(timeRow[0])}:</td><td><b>${esc(timeRow[1])}</b></td></tr>` : ''}
            <tr><td class="muted">Received From:</td><td><b>${esc(o.payer)}</b> ${o.phone ? `<span class="small muted">(${esc(o.phone)})</span>` : ''}</td></tr>
            ${o.onBehalf ? `<tr><td class="muted">On behalf of:</td><td><b>${esc(o.onBehalf)}</b></td></tr>` : ''}

        </div>
      </div>
    </div>
  `;
}

function receiptText() {
  const o = window._rcpt; if (!o) return '';
  return [
    o.biz + ' - PAYMENT RECEIPT',
    'Ref: ' + o.receiptNo,
    o.title ? 'For: ' + o.title : '',
    'Received from: ' + o.payer + (o.phone ? ' (' + o.phone + ')' : ''),
    o.onBehalf ? 'On behalf of: ' + o.onBehalf : '',
    'Amount: ' + moneyReal(o.amount),
    'Purpose: ' + (o.purpose || 'Payment'),
    'Method: ' + (o.method || 'Cash'),
    'Date: ' + o.dateTxt,
    o.timeRow ? o.timeRow[0] + ': ' + o.timeRow[1] : ''
  ].filter(Boolean).join('\n');
}
function copyReceiptText() {
  const t = receiptText();
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => toast('Receipt copied. Paste it anywhere.'));
}
function receiptToPng() {
  return new Promise((resolve, reject) => {
    const o = window._rcpt; if (!o) return reject(new Error('No receipt'));
    const W = 720, pad = 40, scale = 2;
    const font = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    const rows = [['Date', o.dateTxt]];
    if (o.timeRow) rows.push(o.timeRow);
    rows.push(['Received from', o.payer + (o.phone ? ' (' + o.phone + ')' : '')]);
    if (o.onBehalf) rows.push(['On behalf of', o.onBehalf]);
    rows.push(['Purpose', o.purpose || 'Payment'], ['Method', o.method || 'Cash']);
    if (o.note) rows.push(['Note', o.note]);
    const c = document.createElement('canvas'); const ctx = c.getContext('2d');
    const wrap = (t, maxW, f) => {
      ctx.font = f; const words = String(t).split(/\s+/); const lines = []; let cur = '';
      words.forEach(w => { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; });
      if (cur) lines.push(cur); return lines;
    };
    const valW = W - pad * 2 - 200;
    const wrapped = rows.map(([k, v]) => [k, wrap(v, valW, '600 22px ' + font)]);
    const titleLine = wrap(o.title || 'Official Payment Receipt', W - pad * 2, '500 20px ' + font)[0];
    let H = 310; wrapped.forEach(([k, ls]) => { H += ls.length * 30 + 18; }); H += 80;
    c.width = W * scale; c.height = H * scale; ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f766e'; ctx.fillRect(0, 0, W, 12);
    ctx.textAlign = 'center';
    ctx.font = '800 30px ' + font; ctx.fillText(o.biz, W / 2, 70);
    ctx.fillStyle = '#64748b'; ctx.font = '500 20px ' + font; ctx.fillText(titleLine, W / 2, 102);
    ctx.font = '500 18px monospace'; ctx.fillText('Ref: ' + o.receiptNo, W / 2, 134);
    ctx.fillStyle = '#f1f5f9'; ctx.fillRect(pad, 160, W - pad * 2, 100);
    ctx.fillStyle = '#64748b'; ctx.font = '600 18px ' + font; ctx.fillText('AMOUNT PAID', W / 2, 192);
    ctx.fillStyle = '#0f766e';
    let amtSize = 42; const amtTxt = moneyReal(o.amount);
    do { ctx.font = '900 ' + amtSize + 'px ' + font; amtSize -= 2; } while (ctx.measureText(amtTxt).width > W - pad * 2 - 40 && amtSize > 14);
    ctx.fillText(amtTxt, W / 2, 242);
    let y = 305; ctx.textAlign = 'left';
    wrapped.forEach(([k, ls]) => {
      ctx.fillStyle = '#64748b'; ctx.font = '600 20px ' + font; ctx.fillText(k, pad, y);
      ctx.fillStyle = '#0f172a'; ctx.font = '600 22px ' + font; ls.forEach((l, i) => ctx.fillText(l, pad + 200, y + i * 30));
      y += ls.length * 30 + 18;
      ctx.strokeStyle = '#e2e8f0'; ctx.beginPath(); ctx.moveTo(pad, y - 20); ctx.lineTo(W - pad, y - 20); ctx.stroke();
    });
    ctx.textAlign = 'center'; ctx.fillStyle = '#94a3b8'; ctx.font = '500 17px ' + font; ctx.fillText('Recorded with Recordly', W / 2, H - 32);
    c.toBlob(b => b ? resolve(b) : reject(new Error('Could not draw receipt')), 'image/png');
  });
}
function appInviteLink() { return location.origin + location.pathname; }
function saveReceiptImage(blob, o) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'receipt-' + o.receiptNo + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareReceipt(mode) {
  const o = window._rcpt; if (!o) return;
  const invite = appInviteLink();          // the only text that goes with the receipt image
  let blob = null;
  try {
    blob = await receiptToPng();
    const file = new File([blob], 'receipt-' + o.receiptNo + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: invite });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (mode === 'wa') {
    // WhatsApp links cannot attach pictures, so save the image and open WhatsApp with the invite.
    if (blob) { saveReceiptImage(blob, o); toast('Receipt image saved. Attach it in WhatsApp.'); }
    window.open('https://wa.me/?text=' + encodeURIComponent(invite), '_blank');
    return;
  }
  if (navigator.share) {
    try { await navigator.share({ text: invite }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (blob) { saveReceiptImage(blob, o); toast('Receipt image saved to your phone.'); } else { copyText(invite); }
}

// Shrink long amounts so they always fit their box (bigger number = smaller text).
let fitQueued = false;
function fitAmounts() {
  fitQueued = false;
  document.querySelectorAll('.stat-val, .fit-amt').forEach(el => {
    if (!el.clientWidth) return;
    if (!el.dataset.base) el.dataset.base = parseFloat(getComputedStyle(el).fontSize) || 16;
    let size = Number(el.dataset.base);
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth + 1 && size > 10) { size -= 1; el.style.fontSize = size + 'px'; }
  });
}
function queueFit() { if (!fitQueued) { fitQueued = true; requestAnimationFrame(fitAmounts); } }
function initFit() {
  const mo = new MutationObserver(queueFit);
  ['app', 'modalRoot'].forEach(id => { const n = $(id); if (n) mo.observe(n, { childList: true, subtree: true, characterData: true }); });
  window.addEventListener('resize', queueFit);
  queueFit();
}

  if (!t) { toast('Title cannot be empty.'); return; }
  r.title = t;
  r.description = val('editDesc') || null;
  Store.save();
  closeModal();

}

function renderRecordMembersList(r, people) {
  if (!people.length) {
    return `<div class="empty-box">No members added yet. Tap ＋ Add Member to start.</div>`;
  }
  return people.map(p => {
    const paid = (p.payments || []).reduce((a, x) => a + Number(x.amount || 0), 0);
    const target = Number(r.target || 0);
    const pc = target ? Math.min(100, Math.round(paid / target * 100)) : 0;
    const isCompleted = target > 0 && paid >= target;
    return `
      <div class="item-card between">
        <div class="avatar-circle">${esc((p.name || 'M').slice(0, 1).toUpperCase())}</div>
        <div class="grow" style="cursor:pointer;" onclick="location.hash='#/r/${r.id}/${p.id}'">
          <div class="row between">
            <b>${esc(p.name)}</b>
            <span class="badge ${isCompleted ? 'badge-green' : paid > 0 ? 'badge-amber' : 'badge-gray'}">
              ${isCompleted ? 'Completed' : paid > 0 ? `${pc}%` : 'Unpaid'}
            </span>
          </div>
          <div class="muted small">${esc(p.phone || 'No phone')} · <b>${money(paid)}</b> paid ${target ? `(remains ${money(Math.max(0, target - paid))})` : ''}</div>
          ${target ? `<div class="progress-track"><div class="progress-fill" style="width:${pc}%"></div></div>` : ''}
        </div>
        <div class="row">
          <button class="btn-primary btn-sm" onclick="location.hash='#/r/${r.id}/${p.id}'">Manage</button>
          <button class="btn-danger btn-sm" onclick="confirmDeleteMember('${r.id}', '${p.id}')" title="Delete member">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function filterRecordMembers(rid) {
  const r = Store.data.records.find(x => x.id === rid);
  if (!r) return;
  const q = val('memberSearch').toLowerCase();
  const filtered = (r.people || []).filter(p => (p.name || '').toLowerCase().includes(q) || (p.phone || '').includes(q));
  $('recordMembersList').innerHTML = renderRecordMembersList(r, filtered);
}

function toggleRecordProp(rid, prop) {
  const r = Store.data.records.find(x => x.id === rid);
  if (!r) return;
  r[prop] = !r[prop];
  Store.save();
  renderRecordDetail(rid);
  toast(extOk === false && (prop === 'hide_balance' || prop === 'discoverable') ? 'Saved on this phone. Run the Supabase SQL upgrade so it also applies online.' : 'Sharing setting updated.');
}

function confirmDeleteRecord(rid) {
  const r = Store.data.records.find(x => x.id === rid);
  const name = r ? r.title : 'this record';
  if (confirm(`Are you sure you want to permanently delete "${name}" and all its member transactions?`)) {
    Store.data.records = Store.data.records.filter(x => x.id !== rid);
    Store.save();
    toast(`"${name}" was deleted.`);
    if (hash()[0] === 'r') location.hash = '#/contributions';
    else render();
  }
}

function saveMemberPayment(rid, pid) {
  const amt = Number(val('payAmount'));
  if (!amt || amt <= 0) { toast('Please enter a valid payment amount.'); return; }
  const method = val('payMethod');
  const now = new Date();
  const paid_on = val('payDate') || localDate();
  const timeIn = val('payTime');
  let paid_at = null;
  if (timeIn) {
    const t = new Date(paid_on + 'T' + timeIn);
    if (!isNaN(t)) paid_at = t.toISOString();
  } else if (paid_on === localDate(now)) {
    paid_at = now.toISOString();   // paid today and no time typed: the time is right now
  }
  const note = val('payNote') || null;

  const r = Store.data.records.find(x => x.id === rid);
  const p = r?.people?.find(x => x.id === pid);
  if (!r || !p) return;

  p.payments = p.payments || [];
  p.payments.push({
    id: 'rec_pay_' + uid(),
    ref: 'RCP-' + uid().replace(/-/g, '').slice(0, 8).toUpperCase(),
    amount: amt,
    paid_on,
    paid_at,
    method,
    note,
    payer_name: val('payerName') || null,
    payer_phone: val('payerPhone') || null,
    created_at: now.toISOString()
  });

  Store.save();
  toast('Payment recorded successfully!');
  renderMemberAdmin(rid, pid);
}

function deleteMemberPayment(rid, pid, payId) {
  if (confirm('Are you sure you want to delete this payment record? This will adjust the balance.')) {
    const r = Store.data.records.find(x => x.id === rid);
    const p = r?.people?.find(x => x.id === pid);
    if (!r || !p) return;
    p.payments = p.payments.filter(x => x.id !== payId);
    Store.save();
    toast('Payment deleted.');
    renderMemberAdmin(rid, pid);
  }
}

function confirmDeleteMember(rid, pid) {
  if (confirm('Remove this member and their payment history from the record?')) {
    const r = Store.data.records.find(x => x.id === rid);
    if (!r) return;
    r.people = r.people.filter(p => p.id !== pid);
    Store.save();
    toast('Member removed.');
    location.hash = '#/r/' + rid;
  }
}

function saveNewSale() {
  const item = val('saleItemName');
  const qty = Number(val('saleQty')) || 1;
  const price = Number(val('salePrice')) || 0;
  const total = qty * price;
  if (!item || total <= 0) {
    toast('Please enter the item and a valid price.');
    return;
  }

  const custId = val('saleCustomer');
  let custName = val('saleWalkInName') || 'Walk-in Customer';
  if (custId) {
    const found = Store.data.customers.find(c => c.id === custId);
    if (found) custName = found.name;
  }

  const paid = Math.min(total, Number(val('salePaid')) || 0);
  const method = val('saleMethod');
  const date = val('saleDate') || localDate();
  const notes = val('saleNotes') || null;

  let status = 'paid';
  if (paid === 0) status = 'unpaid';
  else if (paid < total) status = 'partial';

  const newSale = {
    id: uid(),
    customer_id: custId || null,
    customer_name: custName,
    items: [{ name: item, qty, price }],
    total,
    amount_paid: paid,
    payment_method: method,
    status,
    date,
    notes,
    created_at: new Date().toISOString(),
    payments: paid > 0 ? [{ id: uid(), amount: paid, paid_on: date, at: new Date().toISOString(), method, note: 'Initial payment' }] : []
  };

  Store.data.sales.unshift(newSale);
  Store.save();
  closeModal();
  toast('Sale recorded!');
  render();
}

function handleCustomerCsvFileSelect(event) {
  const file = event.target.files?.[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const pasteBox = $('customerCsvPasteText');
    if (pasteBox) pasteBox.value = text;
    handleCustomerCsvTextChange(text);
  };
  reader.readAsText(file);
}

function handleCustomerCsvTextChange(rawText) {
  const contacts = parseCustomerCSV(rawText);
  renderCustomerCsvPreview(contacts);
}

function parseCustomerCSV(text) {
  if (!text || !text.trim()) return [];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];

  function splitRow(row) {
    const res = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '"') {
        if (inQuotes && row[i+1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        res.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    res.push(cur.trim());
    return res;
  }

  const rawRows = lines.map(splitRow);
  if (!rawRows.length) return [];

  // Inspect first row for column headers
  const first = rawRows[0].map(h => (h || '').toLowerCase().replace(/[^a-z0-9]/g, ''));
  let nameIdx = -1, phoneIdx = -1, addrIdx = -1, notesIdx = -1;

  first.forEach((h, idx) => {
    if (h.includes('name') || h === 'customer' || h === 'contact') nameIdx = idx;
    else if (h.includes('phone') || h.includes('tel') || h.includes('mobile')) phoneIdx = idx;
    else if (h.includes('address') || h.includes('city') || h.includes('location') || h.includes('state')) addrIdx = idx;
    else if (h.includes('note') || h.includes('remark')) notesIdx = idx;
  });

  let dataRows = rawRows;
  if (nameIdx !== -1) {
    // Header row detected
    dataRows = rawRows.slice(1);
  } else {
    // No explicit headers: default to 0 = Name, 1 = Phone, 2 = Address
    nameIdx = 0;
    phoneIdx = 1;
    addrIdx = 2;
  }

  const parsed = [];
  dataRows.forEach(cols => {
    const name = (cols[nameIdx] || '').trim();
    if (!name) return;
    const phone = phoneIdx !== -1 ? (cols[phoneIdx] || '').trim() : '';
    const address = addrIdx !== -1 ? (cols[addrIdx] || '').trim() : '';
    const notes = notesIdx !== -1 ? (cols[notesIdx] || '').trim() : '';
    parsed.push({
      name,
      phone: phone || null,
      address: address || null,
      notes: notes || null
    });
  });

  return parsed;
}

function renderCustomerCsvPreview(contacts) {
  pendingImportCustomers = contacts;
  const area = $('customerCsvPreviewArea');
  const btn = $('confirmCustomerImportBtn');
  if (!area || !btn) return;

  if (!contacts.length) {
    area.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Import Customers';
    return;
  }

  btn.disabled = false;
  btn.textContent = `Import ${contacts.length} Customer${contacts.length > 1 ? 's' : ''}`;

  area.innerHTML = `
    <div class="banner banner-success" style="font-size:12.5px;margin-bottom:8px;">
      ✓ Detected <b>${contacts.length}</b> customer contact${contacts.length > 1 ? 's' : ''} ready to import.
    </div>
    <div class="table-responsive" style="max-height:160px;border:1px solid var(--line);border-radius:10px;">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Address</th>
          </tr>
        </thead>
        <tbody>
          ${contacts.slice(0, 50).map(c => `
            <tr>
              <td><b>${esc(c.name)}</b></td>

  `;
}

function executeCustomerCsvImport() {
  if (!pendingImportCustomers.length) {
    toast('No valid customers to import.');
    return;
  }

  let count = 0;
  pendingImportCustomers.forEach(c => {
    Store.data.customers.push({
      id: uid(),
      name: c.name,
      phone: c.phone || null,
      address: c.address || null,
      notes: c.notes || null,

  toast(`Successfully imported ${count} customers!`);
  render();
}

/**
 * 4. DEBT TRACKING SECTION (WITH DELETION)
 */
let debtFilter = 'all';

function renderDebts() {
  updateNavActive('debts');

  const debts = Store.data.debts;
  const todayStr = localDate();

  let owedToMe = 0;
  let iOwe = 0;
  let overdueCount = 0;

  debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const balance = Math.max(0, Number(d.original_amount || 0) - repaid);
    if (d.type === 'receivable') owedToMe += balance;
    else iOwe += balance;
    if (balance > 0 && d.due_date && d.due_date < todayStr) overdueCount++;
  });

  let filtered = debts;
  if (debtFilter === 'receivable') filtered = debts.filter(d => d.type === 'receivable');
  else if (debtFilter === 'payable') filtered = debts.filter(d => d.type === 'payable');
  else if (debtFilter === 'overdue') {
    filtered = debts.filter(d => {
      const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
      return (Number(d.original_amount || 0) - repaid) > 0 && d.due_date && d.due_date < todayStr;
    });
  }

  $('app').innerHTML = `
    <div class="card">
      <div class="row between">
        <div>
          <h1>💳 Debt & Credit Tracking</h1>
          <p class="muted">Keep track of money owed to you and money you owe others</p>
        </div>
        <button class="btn-primary" onclick="openDebtModal()">＋ Add Debt</button>
      </div>

      <div class="grid-3" style="margin-top:14px;">
        <div class="stat-box green">
          <div class="stat-label">Owed to You (Receivable)</div>
          <div class="stat-val">${money(owedToMe)}</div>
        </div>
        <div class="stat-box red">
          <div class="stat-label">You Owe (Payable)</div>
          <div class="stat-val">${money(iOwe)}</div>
        </div>
        <div class="stat-box ${overdueCount > 0 ? 'amber' : ''}">
          <div class="stat-label">Overdue Debts</div>
          <div class="stat-val">${overdueCount}</div>
        </div>
      </div>
    </div>

    <!-- Segmented Filter -->
    <div class="tab-bar">
      <button class="tab-btn ${debtFilter === 'all' ? 'active' : ''}" onclick="debtFilter='all';renderDebts();">All (${debts.length})</button>
      <button class="tab-btn ${debtFilter === 'receivable' ? 'active' : ''}" onclick="debtFilter='receivable';renderDebts();">Owed to Me</button>
      <button class="tab-btn ${debtFilter === 'payable' ? 'active' : ''}" onclick="debtFilter='payable';renderDebts();">I Owe</button>
      <button class="tab-btn ${debtFilter === 'overdue' ? 'active' : ''}" onclick="debtFilter='overdue';renderDebts();">Overdue (${overdueCount})</button>
    </div>

    <div class="list">
      ${renderDebtList(filtered, todayStr)}
    </div>
  `;
}

function renderDebtList(debts, todayStr) {
  if (!debts.length) {
    return `
      <div class="card empty-box">
        <h3>No debts matching filter</h3>
        <p class="muted">Add receivables or payables to never lose track of money balances.</p>
        <button class="btn-primary" onclick="openDebtModal()">＋ Record Debt</button>
      </div>
    `;
  }

  return debts.map(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const original = Number(d.original_amount || 0);
    const balance = Math.max(0, original - repaid);
    const isPaid = balance === 0;
    const isOverdue = !isPaid && d.due_date && d.due_date < todayStr;
    const isReceivable = d.type === 'receivable';

    return `
      <div class="card" style="margin-bottom:12px;border-left:4px solid ${isReceivable ? 'var(--primary)' : 'var(--accent-red)'};">
        <div class="row between">
          <div class="row">
            <span class="badge ${isReceivable ? 'badge-green' : 'badge-red'}">
              ${isReceivable ? 'Owed to Me' : 'I Owe'}
            </span>
            ${isOverdue ? `<span class="badge badge-red">⚠️ Overdue</span>` : ''}
            ${isPaid ? `<span class="badge badge-green">✓ Paid Off</span>` : ''}
          </div>
          <div class="row">
            ${!isPaid ? `
              <button class="btn-primary btn-sm" onclick="openRepaymentModal('${d.id}')">＋ Repayment</button>
            ` : ''}
            <button class="btn-soft btn-sm" onclick="openDebtReceipt('${d.id}')">Statement</button>
            <button class="btn-danger btn-sm" onclick="confirmDeleteDebt('${d.id}')" title="Delete debt">Delete</button>
          </div>
        </div>

        <div class="row between" style="margin-top:10px;">
          <div>
            <h3 style="margin:0;">${esc(d.person_name)}</h3>
            <div class="muted small">${esc(d.phone || 'No phone')} ${d.notes ? `· ${esc(d.notes)}` : ''}</div>
            ${d.due_date ? `<div class="small ${isOverdue ? 'badge-red' : 'muted'}" style="margin-top:4px;">Due Date: <b>${esc(d.due_date)}</b></div>` : ''}
          </div>
          <div style="text-align:right;">
            <div class="muted small">Remaining Balance:</div>
            <div style="font-size:20px;font-weight:900;color:${isReceivable ? '#0f766e' : '#e11d48'};">${money(balance)}</div>
            <div class="small muted">Original: ${money(original)} · Repaid: ${money(repaid)}</div>
          </div>
        </div>

        ${(d.repayments || []).length ? `
          <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;">
            <b class="muted">Repayment History:</b>
            <div class="row" style="margin-top:4px;">
              ${d.repayments.map(r => `
                <span class="badge badge-gray">${esc(r.date)}: ${money(r.amount)} ${r.note ? `(${esc(r.note)})` : ''}</span>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function saveNewDebt() {
  const type = val('debtType');
  const person = val('debtPerson');
  const amt = Number(val('debtAmount'));
  if (!person || !amt || amt <= 0) {
    toast('Please enter person name and a valid debt amount.');
    return;
  }

  Store.data.debts.unshift({
    id: uid(),
    type,
    person_name: person,
    phone: val('debtPhone') || null,
    original_amount: amt,
    due_date: val('debtDueDate') || null,
    notes: val('debtNotes') || null,
    created_at: new Date().toISOString(),
    repayments: []
  });

  Store.save();
  closeModal();
  toast('Debt record created!');
  render();
}

function openRepaymentModal(debtId) {
  const d = Store.data.debts.find(x => x.id === debtId);
  if (!d) return;
  const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
  const balance = Math.max(0, Number(d.original_amount) - repaid);

  $('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-window">
        <div class="row between" style="margin-bottom:12px;">
          <h2>Log Repayment</h2>
          <button class="btn-outline btn-icon" onclick="closeModal()">✕</button>
        </div>
        <p class="muted">${d.type === 'receivable' ? 'From' : 'To'}: <b>${esc(d.person_name)}</b></p>
        <div class="stat-box amber" style="margin:10px 0;">
          <div class="stat-label">Remaining Balance</div>
          <div class="stat-val">${money(balance)}</div>
        </div>

        <div class="field">
          <label for="repAmount">Repayment Amount (₦) *</label>
          <input id="repAmount" type="number" min="1" max="${balance}" value="${balance}">
        </div>

        <div class="field">
          <label for="repDate">Date</label>
          <input id="repDate" type="date" value="${localDate()}">
        </div>

        <div class="field">
          <label for="repNote">Note</label>
          <input id="repNote" placeholder="e.g. Bank transfer ref / installment">
        </div>

        <div class="row between" style="margin-top:16px;">
          <button class="btn-outline" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="saveDebtRepayment('${d.id}')">Save Repayment</button>
        </div>
      </div>
    </div>
  `;
}

function saveDebtRepayment(debtId) {
  const d = Store.data.debts.find(x => x.id === debtId);
  if (!d) return;
  const amt = Number(val('repAmount'));
  if (!amt || amt <= 0) { toast('Please enter a valid amount.'); return; }

  if (!d.repayments) d.repayments = [];
  d.repayments.push({
    id: uid(),
    amount: amt,
    date: val('repDate') || localDate(),
    at: new Date().toISOString(),
    note: val('repNote') || 'Repayment'
  });

  Store.save();
  closeModal();
  toast('Repayment recorded!');
  render();
}

function confirmDeleteDebt(debtId) {
  if (confirm('Permanently delete this debt record and all repayment logs?')) {
    Store.data.debts = Store.data.debts.filter(d => d.id !== debtId);
    Store.save();
    toast('Debt record deleted.');
    render();
  }
}

function exportDataToCSV() {
  let csv = 'SECTION,TITLE_OR_NAME,AMOUNT_OR_TOTAL,STATUS_OR_DATE,NOTES\n';

  Store.data.records.forEach(r => {
    (r.people || []).forEach(p => {
      const paid = (p.payments || []).reduce((a, x) => a + Number(x.amount || 0), 0);
      csv += `"Contribution: ${r.title}","${p.name}",${paid},"${r.end_date || 'Ongoing'}","Phone: ${p.phone || ''} | ${r.description || ''}"\n`;
    });
  });

  Store.data.sales.forEach(s => {
    csv += `"Sale","${s.customer_name}",${s.total},"${s.date} - ${s.status}","Paid: ${s.amount_paid} | ${s.payment_method}"\n`;
  });

  Store.data.expenses.forEach(e => {
    csv += `"Expense: ${e.category}","${e.description}",${e.amount},"${e.date}",""\n`;
  });

  Store.data.debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    csv += `"Debt (${d.type})","${d.person_name}",${d.original_amount},"${d.due_date || 'No date'}","Repaid: ${repaid}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `recordly_export_${localDate()}.csv`;
  a.click();
  toast('CSV report downloaded!');
}

/**

 */
let inbox = { joins: [], visits: [] };
let extOk = null;          // null = not tested yet, true = new columns exist online, false = SQL upgrade not run yet
let liveChan2 = null;

async function upsertSafe(table, rows, extKeys) {
  if (!rows.length) return;
  if (extOk !== false) {
    const res = await sb.from(table).upsert(rows);
    if (!res.error) return;
    const msg = String(res.error.message || '') + ' ' + String(res.error.code || '');
    if (!/column|schema cache|PGRST204|42703/i.test(msg)) throw res.error;
    extOk = false;   // new columns are not in the database yet: save the basics so nothing is lost
  }
  const base = rows.map(r => { const c = Object.assign({}, r); extKeys.forEach(k => delete c[k]); return c; });
  const res2 = await sb.from(table).upsert(base);
  if (res2.error) throw res2.error;
}

// Background refreshes must never wipe a form someone is typing in or a modal that is open.
function softRender() {
  const a = document.activeElement;
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  const modalOpen = $('modalRoot') && $('modalRoot').innerHTML.trim() !== '';
  if (typing || modalOpen) return;
  render();
}
