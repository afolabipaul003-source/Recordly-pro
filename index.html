function visitAlert(x, silent) {
  if (!x || liveAlerts.some(a => a.key === x.id)) return;
  const rec = (Store.data.records || []).find(r => r.id === x.record_id);
  const where = rec ? rec.title : 'your group';
  const who = x.visitor_name || 'Someone';
  let title;
  if (x.source === 'invite') title = who + ' opened your invite to ' + where;
  else if (x.source === 'search') title = who + ' found ' + where + ' in search';
  else title = who + ' opened a shared link for ' + where;
  const link = rec ? '#/r/' + rec.id : '#/notifications';
  if (silent) {
    liveAlerts.unshift({ title, desc: fmtDateTime(x.created_at), link, at: Date.parse(x.created_at) || Date.now(), key: x.id });
    liveAlerts = liveAlerts.slice(0, 30);
    try { localStorage.setItem('rc_alerts', JSON.stringify(liveAlerts)); } catch (e) {}
    const b = $('notifCountBadge'); if (b) b.style.display = 'block';
  } else {
    pushAlert(title, fmtDateTime(x.created_at), link, x.id);
  }
}

async function loadInbox() {
  if (!user) return;
  try {
    const j = await sb.from('join_requests').select('id,record_id,requester_id,requester_name,requester_phone,status,person_id,created_at').eq('owner_id', user.id).order('created_at', { ascending: false }).limit(50);
    if (!j.error && j.data) inbox.joins = j.data;
  } catch (e) {}
  try {
    const since = localStorage.getItem('rc_visits_since') || new Date(Date.now() - 7 * 864e5).toISOString();
    const v = await sb.from('visits').select('id,record_id,person_id,source,visitor_name,created_at').eq('owner_id', user.id).gt('created_at', since).order('created_at', { ascending: false }).limit(30);
    if (!v.error && v.data) v.data.slice().reverse().forEach(x => visitAlert(x, true));
    if (!v.error) localStorage.setItem('rc_visits_since', new Date().toISOString());
  } catch (e) {}
  setTop();
}

function startInboxLive() {
  if (liveChan2) { try { sb.removeChannel(liveChan2); } catch (e) {} liveChan2 = null; }
  if (!user) return;
  liveChan2 = sb.channel('inbox-' + user.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'visits' }, m => {
      if (!m.new || m.new.owner_id !== user.id) return;
      visitAlert(m.new, false);
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'join_requests' }, m => {
      const j = m.new; if (!j || j.owner_id !== user.id) return;
      inbox.joins.unshift(j);
      const rec = (Store.data.records || []).find(r => r.id === j.record_id);
      pushAlert((j.requester_name || 'Someone') + ' wants to join ' + (rec ? rec.title : 'your group'), 'Open Notifications to approve or decline.', '#/notifications');
      setTop();
      if (hash()[0] === 'notifications') renderNotifications();
    })
    .subscribe();
}

async function resolveJoin(reqId, approve) {
  const j = (inbox.joins || []).find(x => x.id === reqId); if (!j) return;
  let personId = null;
  if (approve) {
    const rec = (Store.data.records || []).find(r => r.id === j.record_id);
    if (!rec) { toast('This group is not on this phone yet. Refresh the app and try again.'); return; }
    personId = uid();
    rec.people = rec.people || [];
    rec.people.push({ id: personId, name: j.requester_name || 'Member', phone: j.requester_phone || '', payments: [] });
    Store.save();
    try { await syncRecordsToDb(); } catch (e) {}
  }
  const { error } = await sb.rpc('rc_resolve_join', { req: reqId, approve: !!approve, person: personId });
  if (error) { toast('Could not save your answer: ' + (error.message || error)); return; }
  j.status = approve ? 'approved' : 'rejected'; j.person_id = personId;
  toast(approve ? 'Approved. They are now a member.' : 'Request declined.');
  setTop();
  renderNotifications();
}

async function renderCore() {
  setTop();
  scheduleDbSync();
  try {
    const p = hash();
    if (p[0] === 'p' && p[1]) return await renderPublicPerson(p[1], p[2]);
    if (p[0] === 'g' && p[1]) return await renderPublicGroup(p[1], p[2]);
    if (p[0] === 'j' && p[1]) return await renderJoinPage(p[1], p[2]);
    if (!user) return renderLoggedOut();
    if (p[0] === 'discover') return renderDiscover();
    if (p[0] === 'contributions') {
      if (p[1] === 'new') return newRecordForm();
      return renderContributions();
    }
    if (p[0] === 'r' && p[1]) {
      if (p[2]) return renderMemberAdmin(p[1], p[2]);
      return renderRecordDetail(p[1]);
    }
    if (p[0] === 'business') return renderBusiness();
    if (p[0] === 'debts') return renderDebts();
    if (p[0] === 'reports') return renderReports();
    if (p[0] === 'more') return renderMore();
    if (p[0] === 'notifications') return renderNotifications();

    return renderDashboard();
  } catch (e) {
    console.error('Render error:', e);
    $('app').innerHTML = `
      <div class="card empty-box">
        <h2>Something went wrong</h2>
        <p class="muted">${esc(e.message || String(e))}</p>
        <button class="btn-primary" onclick="location.hash='#/'">Go to Dashboard</button>
      </div>
    `;
  }
}

async function start() {
  initTheme();
  updateMaskIcon();
  initFit();
  Store.init();

  try {
    const { data } = await sb.auth.getSession();
    user = data?.session?.user || null;
    sb.auth.onAuthStateChange((event, session) => {
      const prev = user;
      user = session?.user || null;
      // Token refreshes, profile/backup updates and tab re-focus fire this event too.
      // Only restart the screen when the signed-in person actually changes.
      if ((prev?.id || null) === (user?.id || null) && event !== 'SIGNED_OUT') return;
      try { if (user && event === 'SIGNED_IN' && user.app_metadata?.provider === 'google' && user.email && Date.now() - new Date(user.created_at).getTime() < 120000) localStorage.setItem('rc_newuser', user.email); } catch (e) {}
      setTop();
      render();
      if (user) {
        loadAccountData().then(() => syncLocalDataToSupabase({ silent: true }));
      }
    });
  } catch (e) {
    console.warn('Supabase auth offline fallback:', e);
  }

  // Start periodic cloud sync every 45 seconds
  startPeriodicCloudSync(45000);
  startIdleLogout();

  // Sync when browser reconnects to internet
  window.addEventListener('online', () => {
    syncLocalDataToSupabase({ silent: true });
  });

  if (user) await loadAccountData();
  window.addEventListener('hashchange', render);
  await render();

  if (user) {
    syncLocalDataToSupabase({ silent: true });
  }
}

start();
</script>
</body>
</html>
